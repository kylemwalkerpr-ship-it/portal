name = "yousafe-portal"
main = ".open-next/worker.js"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]
minify = true

# ── Limits (Workers Paid plan required) ────────────────────────────────
# Every route hits Cloudflare Error 1102 (503) on the Free plan because the
# OpenNext-bundled Next.js handler (~10 MB) alone exceeds the 10 ms CPU
# ceiling before any app logic runs. Upgrade to Workers Paid then uncomment:
#
# [limits]
# cpu_ms = 300000
#
# Required: `npx wrangler queues create content-queue` + add a [[queues]]
# producer binding for async job processing as the eventual architecture.
# Reference: opennextjs/opennextjs-cloudflare#598.

# ── KV Namespaces ───────────────────────────────────────────────────────
# KV-based page cache for expensive operations (featured gigs, etc.).
# Created with: npx wrangler kv namespace create "PAGE_CACHE"
[[kv_namespaces]]
binding = "PAGE_CACHE"
id = "a60944658f974790acc6c74a35c661aa"

# ── Workers AI ──────────────────────────────────────────────────────────
# Native translation via @cf/meta/m2m100-1.2b — replaces MyMemory as the
# primary provider (MyMemory rate-limits per IP, and Cloudflare's shared
# egress IPs are permanently exhausted, so it never worked from prod).
[ai]
binding = "AI"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsucG9ydGFsLnlvdXNhZmVjb25zdWx0YW5jeS5jb20k"
CLERK_AUTHORIZED_PARTIES = "https://portal.yousafeconsultancy.com,https://market.yousafeconsultancy.com"
# Pin the clerk-js SDK to an exact patch so the browser loads it from
# /npm/@clerk/clerk-js@6.12.1/... directly. Without this, Clerk falls
# back to the major-version alias /npm/@clerk/clerk-js@6/... which
# returns 307 → 6.12.1 and gets every page flagged in Ahrefs as
# "page-has-redirected-JS" (~11.5k rows on the 2026-06-01 audit, ~71%
# of total issue volume). Bump this when upgrading @clerk/nextjs; the
# package.json lockfile is the source of truth for the right value.
NEXT_PUBLIC_CLERK_JS_VERSION = "6.12.1"
NEXT_PUBLIC_SUPABASE_URL = "https://krggzrxxnqfsbbklatxl.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZ2d6cnh4bnFmc2Jia2xhdHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NDQyMzAsImV4cCI6MjA5MzEyMDIzMH0.AUNTc5D6aMnVC0orz-XA1W4ABkok_LWCWBjCaoAK4LE"
# Payment provider abstraction (lib/payments). PAYMENT_PROVIDER selects the
# active gateway adapter; NMI_TOKENIZATION_KEY is the NMI public Collect.js
# key (client-safe by design — used in the browser). The private
# NMI_SECURITY_KEY is NOT here — it is an encrypted Worker secret set with
# `wrangler secret put NMI_SECURITY_KEY`.
PAYMENT_PROVIDER = "authorizenet"
NMI_TOKENIZATION_KEY = "H4p48s-f4v55B-8Km4eJ-8yR74U"
# Reseller-issued white-label gateway host — both Collect.js and the Payment
# API live here. NMI's default secure.nmi.com would reject our merchant
# account's tokenization key.
NMI_GATEWAY_HOST = "paykings.transactiongateway.com"
# 'lightbox' = a single "Pay" button opens NMI's hosted modal (simplest +
# no card fields on our page). 'inline' for embedded iframe fields.
NMI_COLLECT_VARIANT = "lightbox"

# ── Authorize.net (via Kurv Pay merchant) ─────────────────────────────────
# Second gateway running ALONGSIDE NMI. Per-card and per-order routing is
# stored on the `gateway` column added in supabase/payments_add_gateway_column.sql.
# Existing NMI-vaulted cards stay on NMI; new cards default to whichever
# gateway PAYMENT_PROVIDER points at (or the platform_settings override).
#
# Worker secrets (NOT in this file — set with `wrangler secret put <NAME>`):
#   AUTHORIZENET_LOGIN_ID         — API login id from the Authorize.net merchant portal.
#   AUTHORIZENET_TRANSACTION_KEY  — API transaction key (private, server-only).
#   AUTHORIZENET_SIGNATURE_KEY    — HMAC-SHA512 webhook signature key.
#
# Public values below are safe in this file (the public client key is used in
# the browser by Accept.js — same shape as NMI_TOKENIZATION_KEY).
AUTHORIZENET_PUBLIC_CLIENT_KEY = "84fvNs62h75DMVvGwg4vw95s3bLeHjg6wDNtx99uZrPeJGTvScP7btKVnM3LgKW6"
AUTHORIZENET_ENVIRONMENT = "production"
# 'accept-js' = embedded card fields tokenize client-side via Accept.js (matches
# NMI Collect.js inline UX). 'accept-hosted' would redirect to Authorize.net's
# hosted payment page — out of scope for the current integration.
AUTHORIZENET_ACCEPT_VARIANT = "accept-js"

# ── Required Secrets (set with `npx wrangler secret put <NAME>`) ────────
# These are NOT in wrangler.toml — set them individually:
#
#   NVIDIA_API_KEY   — DeepSeek V4 Pro via NVIDIA (default AI provider)
#   GITHUB_TOKEN     — GitHub PAT for shipContent (PRs, merges, deploys)
#   SUPABASE_SERVICE_ROLE_KEY — Server-side Supabase access (content_jobs, etc.)
#   CLOUDFLARE_AI_TOKEN      — Fallback AI when NVIDIA key is exhausted
#   RESEND_API_KEY   — Transactional email (attorney decision notifications)
#
# Without NVIDIA_API_KEY, the Auto-Pilot and Content Studio cannot generate
# content — they fall through all providers because none are configured.
# Without GITHUB_TOKEN, shipContent returns 503 on PR/merge operations.

# Resend transactional email key. Used for attorney application decision emails.
# Set with: npx wrangler secret put RESEND_API_KEY
# Sender domain (yousafeconsultancy.com) is already verified in Resend.
# RESEND_API_KEY = ""

[[routes]]
pattern = "portal.yousafeconsultancy.com"
custom_domain = true

[[routes]]
pattern = "market.yousafeconsultancy.com"
custom_domain = true
