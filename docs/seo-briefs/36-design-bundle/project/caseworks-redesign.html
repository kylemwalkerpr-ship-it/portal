<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caseworks — Editorial redesign</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* TYPE */
      --font-display: 'Lora', 'Source Serif 4', Georgia, serif;
      --font-body:    'Lora', 'Source Serif 4', Georgia, serif;
      --font-ui:      'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, monospace;

      /* PALETTE - warm paper light theme */
      --paper:      oklch(98%  0.005 80);
      --paper-dim:  oklch(96%  0.006 80);
      --paper-deep: oklch(93%  0.008 80);
      --ink:        oklch(20%  0.01  60);
      --ink-mid:    oklch(40%  0.008 60);
      --ink-soft:   oklch(58%  0.006 60);
      --rule:       oklch(88%  0.008 60);
      --rule-soft:  oklch(93%  0.006 60);
      --accent:     oklch(55%  0.13  35);   /* brick */
      --accent-ink: oklch(40%  0.13  35);
      --highlight:  oklch(92%  0.10  95);   /* highlighter yellow, paper-toned */

      /* SCALE */
      --reading-width: 680px;
      --max-width:     1240px;
      --density-pad:   24px;

      /* MOTION */
      --ease: cubic-bezier(.22,.61,.36,1);
    }

    html, body { background: var(--paper); color: var(--ink); }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "kern", "liga", "onum";
    }

    *, *::before, *::after { box-sizing: border-box; }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: default; padding: 0; }

    .ui { font-family: var(--font-ui); }
    .mono { font-family: var(--font-mono); }
    .serif { font-family: var(--font-display); }

    /* Reading-mode body type */
    .prose {
      font-family: var(--font-body);
      font-size: 20px;
      line-height: 1.7;
      color: var(--ink);
    }
    .prose p { margin: 0 0 1.4em; text-wrap: pretty; }
    .prose h2 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 32px;
      line-height: 1.2;
      margin: 2.2em 0 0.6em;
      letter-spacing: -0.012em;
    }
    .prose h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 24px;
      line-height: 1.25;
      margin: 1.6em 0 0.4em;
      letter-spacing: -0.008em;
    }
    .prose blockquote {
      margin: 1.6em 0;
      padding: 0 0 0 24px;
      border-left: 3px solid var(--ink);
      font-style: italic;
      font-size: 24px;
      line-height: 1.45;
      color: var(--ink);
    }
    .prose ul, .prose ol { padding-left: 1.4em; margin: 0 0 1.4em; }
    .prose li { margin: 0.35em 0; }
    .prose a { color: var(--accent-ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .prose strong { font-weight: 600; }
    .prose code { font-family: var(--font-mono); font-size: 0.92em; background: var(--paper-deep); padding: 1px 6px; border-radius: 3px; }
    .prose mark { background: var(--highlight); padding: 0 2px; }

    /* Striped placeholder used for missing imagery */
    .imgph {
      position: relative;
      overflow: hidden;
      background:
        repeating-linear-gradient(135deg,
          oklch(92% 0.01 60) 0 14px,
          oklch(95% 0.008 60) 14px 28px);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }
    .imgph::after {
      content: attr(data-label);
      padding: 10px 12px;
      background: var(--paper);
      border-top: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      border-top-right-radius: 4px;
    }

    /* Dark mode overrides (toggled via data-theme=dark on html) */
    html[data-theme="dark"] {
      --paper:      oklch(16%  0.008 60);
      --paper-dim:  oklch(19%  0.008 60);
      --paper-deep: oklch(22%  0.008 60);
      --ink:        oklch(94%  0.006 80);
      --ink-mid:    oklch(75%  0.006 80);
      --ink-soft:   oklch(60%  0.006 80);
      --rule:       oklch(30%  0.008 60);
      --rule-soft:  oklch(25%  0.008 60);
      --highlight:  oklch(48%  0.12  95);
    }
    html[data-theme="dark"] .imgph {
      background:
        repeating-linear-gradient(135deg,
          oklch(24% 0.008 60) 0 14px,
          oklch(28% 0.008 60) 14px 28px);
    }

    /* Smooth color transitions for theme switching */
    html, body, .nav, .footer, .card, .surface, .pill, .ph { transition: background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease); }

    /* Selection */
    ::selection { background: var(--highlight); color: var(--ink); }
  </style>

  <!-- Tweak defaults (host parses + persists this block) -->
  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#2a4a8a",
      "fontPair": "source-inter",
      "paperTone": "sepia",
      "density": "compact",
      "dark": false,
      "showBylines": true,
      "readingWidth": 680
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="reader.jsx"></script>
  <script type="text/babel" src="author.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
