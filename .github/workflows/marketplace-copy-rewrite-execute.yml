name: Execute Marketplace Copy Rewrite

on:
  push:
    branches: [main]
    paths:
      - '.github/marketplace-copy-rewrite.run'

permissions:
  contents: read

concurrency:
  group: marketplace-copy-rewrite-production
  cancel-in-progress: false

jobs:
  rewrite:
    name: Execute 217-gig and 70-provider copy migration
    if: contains(github.event.head_commit.message, '[run-marketplace-copy-rewrite]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify one-time enable marker
        shell: bash
        run: |
          test -f .github/marketplace-copy-rewrite.enabled
          echo "One-time Marketplace copy rewrite is enabled."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify gig images before copy rewrite
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: node scripts/verify-marketplace-image-preservation.mjs

      - name: Rewrite and audit Marketplace copy
        env:
          MARKETPLACE_COPY_REWRITE: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          ENTRIM_API_KEY: ${{ secrets.ENTRIM_API_KEY }}
          ENTRIM_BASE_URL: ${{ secrets.ENTRIM_BASE_URL }}
        run: node scripts/run-marketplace-copy-rewrite.mjs

      - name: Verify gig images after copy rewrite
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: node scripts/verify-marketplace-image-preservation.mjs
