name: One-time GSC soft-404 routing hardening

on:
  push:
    branches:
      - seo/gsc-ga-final-hardening
    paths:
      - '.github/workflows/one-time-gsc-soft404-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/gsc-ga-final-hardening
          fetch-depth: 0

      - name: Patch legacy Marketplace aliases and search indexing
        run: |
          python - <<'PY'
          from pathlib import Path

          middleware = Path('middleware.ts')
          text = middleware.read_text()
          old = '''    // The historical public `/marketplace` namespace is retired. Do this
              // before query sanitization so no prefixed request can gain a redirect hop
              // or alternate 200. Clean market-domain paths are the sole public contract.
              const isLegacyMarketplacePath = pathname === '/marketplace' || pathname.startsWith('/marketplace/')
              if ((hostname === MARKET_HOST || hostname === PORTAL_HOST) && isLegacyMarketplacePath) {
                return new NextResponse('Not Found', {
                  status: 404,
                  headers: { 'content-type': 'text/plain; charset=utf-8', ...corsHeadersFor(req) },
                })
              }
          '''
          # Match without depending on indentation embedded by this YAML block.
          old = old.replace('              ', '')
          new = '''    // Historical public `/marketplace` URLs still exist in search-engine crawl
              // history and external links. Retire the namespace without throwing away
              // those signals: permanently canonicalize it to the clean market-host path.
              // `/marketplace?q=OPT` -> `/?q=OPT`; `/marketplace/providers/` -> `/providers/`.
              const isLegacyMarketplacePath = pathname === '/marketplace' || pathname.startsWith('/marketplace/')
              if ((hostname === MARKET_HOST || hostname === PORTAL_HOST) && isLegacyMarketplacePath) {
                const cleanPath = pathname === '/marketplace'
                  ? '/'
                  : pathname.slice('/marketplace'.length) || '/'
                const redirectUrl = new URL(cleanPath + search, `https://${MARKET_HOST}`)
                return withCorsHeaders(NextResponse.redirect(redirectUrl, { status: 301 }), req)
              }
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy marketplace block, found {text.count(old)}')
          text = text.replace(old, new)

          old_rewrite = '''        const rewrite = new URL(`/marketplace${pathname}${search}`, req.url)
                return withCorsHeaders(withPathHeaders(NextResponse.rewrite(rewrite), pathname, search, lang), req)
          '''.replace('                ', '')
          new_rewrite = '''        const rewrite = new URL(`/marketplace${pathname}${search}`, req.url)
                const response = withCorsHeaders(withPathHeaders(NextResponse.rewrite(rewrite), pathname, search, lang), req)
                // Free-text result pages are useful to visitors but are unbounded, can be
                // empty, and must not become thin indexable URLs. Keep links followable so
                // crawlers can still discover real gigs/providers reached from results.
                if (req.nextUrl.searchParams.has('q')) {
                  response.headers.set('X-Robots-Tag', 'noindex, follow')
                }
                return response
          '''.replace('                ', '')
          if text.count(old_rewrite) != 1:
              raise SystemExit(f'expected exactly one market rewrite block, found {text.count(old_rewrite)}')
          middleware.write_text(text.replace(old_rewrite, new_rewrite))

          test_file = Path('tests/marketplace-public-route-contract.test.ts')
          tests = test_file.read_text()
          old_test = '''  test('retired /marketplace paths are hard 404s on portal and market, never migration redirects', () => {
              const middleware = read('middleware.ts')
              expect(middleware).toContain("const isLegacyMarketplacePath = pathname === '/marketplace' || pathname.startsWith('/marketplace/')")
              expect(middleware).toContain('(hostname === MARKET_HOST || hostname === PORTAL_HOST) && isLegacyMarketplacePath')
              expect(middleware).toContain("return new NextResponse('Not Found', {")
              expect(middleware).toContain('status: 404')
              expect(middleware).not.toContain('const cleanPath = pathname.slice(\\'/marketplace\\'.length)')
            })
          '''.replace('              ', '')
          new_test = '''  test('legacy /marketplace paths permanently canonicalize to clean market-host routes', () => {
              const middleware = read('middleware.ts')
              expect(middleware).toContain("const isLegacyMarketplacePath = pathname === '/marketplace' || pathname.startsWith('/marketplace/')")
              expect(middleware).toContain('(hostname === MARKET_HOST || hostname === PORTAL_HOST) && isLegacyMarketplacePath')
              expect(middleware).toContain("pathname.slice('/marketplace'.length)")
              expect(middleware).toContain('const redirectUrl = new URL(cleanPath + search, `https://${MARKET_HOST}`)')
              expect(middleware).toContain('NextResponse.redirect(redirectUrl, { status: 301 })')
            })

            test('free-text Marketplace result URLs are noindex,follow while remaining usable', () => {
              const middleware = read('middleware.ts')
              expect(middleware).toContain("req.nextUrl.searchParams.has('q')")
              expect(middleware).toContain("response.headers.set('X-Robots-Tag', 'noindex, follow')")
            })
          '''.replace('              ', '')
          if tests.count(old_test) != 1:
              raise SystemExit(f'expected exactly one legacy route test block, found {tests.count(old_test)}')
          test_file.write_text(tests.replace(old_test, new_test))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-gsc-soft404-hardening.yml

      - name: Commit hardened routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add middleware.ts tests/marketplace-public-route-contract.test.ts .github/workflows/one-time-gsc-soft404-hardening.yml
          git commit -m 'fix(seo): canonicalize legacy marketplace crawl paths'
          git push origin HEAD:seo/gsc-ga-final-hardening
