name: Apply GA4 purchase callsite patch

on:
  push:
    branches:
      - seo/ga4-marketplace-purchase
    paths:
      - .github/workflows/ga4-purchase-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/ga4-marketplace-purchase
          fetch-depth: 0

      - name: Patch confirmed-order GA4 purchase callsite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/marketplace/GigDetailPage.tsx')
          text = path.read_text()

          old_import = "import { providerDisplayName } from '@/lib/providerDisplayName'\n"
          new_import = old_import + "import { trackPurchase } from '@/lib/analytics/ga4'\n"
          if "import { trackPurchase } from '@/lib/analytics/ga4'" not in text:
              if old_import not in text:
                  raise SystemExit('expected providerDisplayName import not found')
              text = text.replace(old_import, new_import, 1)

          old_block = """      const orderId = payload?.orderId || payload?.order?.id || null
      const url = payload?.url || (orderId ? marketplaceOrdersHref(orderId) : null)
      setPlacedOrderId(orderId)
"""
          new_block = """      const orderId = payload?.orderId || payload?.order?.id || null
      const selectedTier = (gig.tiers || []).find((tier: any) => tier.id === selectedTierId)
      const priceCents = Number(selectedTier?.price ?? gig.starting_price ?? 0)
      if (orderId && Number.isFinite(priceCents) && priceCents > 0) {
        const purchaseKey = `ys_ga4_purchase_${orderId}`
        if (!window.sessionStorage.getItem(purchaseKey)) {
          const value = priceCents / 100
          trackPurchase({
            transaction_id: orderId,
            value,
            currency: 'USD',
            items: [{
              item_id: gig.id,
              item_name: gig.title,
              price: value,
              quantity: 1,
              item_category: gig.category || undefined,
            }],
          })
          window.sessionStorage.setItem(purchaseKey, '1')
        }
      }
      const url = payload?.url || (orderId ? marketplaceOrdersHref(orderId) : null)
      setPlacedOrderId(orderId)
"""
          if "ys_ga4_purchase_${orderId}" not in text:
              if old_block not in text:
                  raise SystemExit('expected confirmed-order block not found')
              text = text.replace(old_block, new_block, 1)

          path.write_text(text)

          test = Path('tests/ga4-purchase-checkout-contract.test.ts')
          test.write_text("""import fs from 'node:fs'\nimport path from 'node:path'\n\nconst source = fs.readFileSync(path.join(process.cwd(), 'components/marketplace/GigDetailPage.tsx'), 'utf8')\n\ndescribe('Marketplace GA4 purchase contract', () => {\n  it('fires purchase only from the confirmed-order success path with dedupe and revenue fields', () => {\n    expect(source).toContain(\"import { trackPurchase } from '@/lib/analytics/ga4'\")\n    expect(source).toContain('const orderId = payload?.orderId || payload?.order?.id || null')\n    expect(source).toContain('const purchaseKey = `ys_ga4_purchase_${orderId}`')\n    expect(source).toContain('if (!window.sessionStorage.getItem(purchaseKey))')\n    expect(source).toContain('trackPurchase({')\n    expect(source).toContain('transaction_id: orderId')\n    expect(source).toContain('value,')\n    expect(source).toContain(\"currency: 'USD'\")\n    expect(source).toContain('window.sessionStorage.setItem(purchaseKey')\n    expect(source.indexOf('const orderId = payload?.orderId')).toBeLessThan(source.indexOf('trackPurchase({'))\n  })\n})\n""")
          PY

      - name: Remove one-time patch workflow
        run: git rm .github/workflows/ga4-purchase-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/marketplace/GigDetailPage.tsx tests/ga4-purchase-checkout-contract.test.ts .github/workflows/ga4-purchase-patch.yml
          git commit -m "feat(analytics): emit GA4 purchase after confirmed marketplace order"
          git push origin HEAD:seo/ga4-marketplace-purchase
