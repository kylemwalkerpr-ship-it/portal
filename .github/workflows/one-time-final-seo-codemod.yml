name: One-time final SEO codemod

on:
  push:
    branches:
      - seo/final-console-cleanup

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/final-console-cleanup
          fetch-depth: 0
      - name: Apply scoped SEO source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Bing's public /shop warning is caused by product covers with empty alt text.
          shop = Path('app/shop/FilesShop.tsx')
          text = shop.read_text()
          old = '<img src={product.cover} alt="" width={1200} height={1600} />'
          new = '<img src={product.cover} alt={`${product.title} cover`} width={1200} height={1600} />'
          if old not in text:
              raise SystemExit('FilesShop cover pattern changed; refusing broad rewrite')
          shop.write_text(text.replace(old, new, 1))

          # Keep future generated shop-article title tags concise without changing H1/OG copy.
          generator = Path('lib/shopSeoGenerator.ts')
          text = generator.read_text()
          helper_anchor = "function estimateReadTime(text: string): string {"
          helper = """function conciseSeoTitle(title: string): string {\n  const withoutParenthetical = title.replace(/\\s*\\([^)]*\\)\\s*$/, '').trim()\n  const primary = withoutParenthetical.split(':', 1)[0]?.trim() || withoutParenthetical\n  const candidate = primary.length >= 20 ? primary : withoutParenthetical\n  if (candidate.length <= 58) return candidate\n  return candidate.slice(0, 58).replace(/\\s+\\S*$/, '').replace(/[,:;–—-]+$/, '').trim()\n}\n\n"""
          if 'function conciseSeoTitle(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('shopSeoGenerator helper anchor changed')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          variable_anchor = "  const features = featureLines(product)\n"
          if '  const seoTitle = conciseSeoTitle(product.title)\n' not in text:
              if variable_anchor not in text:
                  raise SystemExit('shopSeoGenerator variable anchor changed')
              text = text.replace(variable_anchor, variable_anchor + "  const seoTitle = conciseSeoTitle(product.title)\n", 1)
          old_title = '  parts.push(`  title: "${esc(product.title)} | YouSafe Consultancy Shop",`)'
          new_title = '  parts.push(`  title: "${esc(seoTitle)}",`)'
          if old_title not in text and new_title not in text:
              raise SystemExit('shopSeoGenerator title pattern changed')
          text = text.replace(old_title, new_title, 1)
          generator.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            echo "No codemod changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shop/FilesShop.tsx lib/shopSeoGenerator.ts
          git commit -m "seo: normalize public shop image and title metadata"
          git push origin HEAD:seo/final-console-cleanup
