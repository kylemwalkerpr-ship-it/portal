name: One-time marketplace category URL patch

on:
  push:
    branches:
      - fix/marketplace-clean-category-urls-cards

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketplace-clean-category-urls-cards
          fetch-depth: 0

      - name: Apply focused URL cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          discovery_path = Path('components/marketplace/GigDiscoveryPage.tsx')
          discovery = discovery_path.read_text()

          browser_query_block = """  // Category routes already encode their base category in the pathname. Keep\n  // that category in API requests, but do not duplicate it as\n  // `?category=<same-id>` in the address bar. Additional category filters\n  // remain shareable query parameters.\n  const buildBrowserQuery = React.useCallback(() => {\n    const params = buildQuery()\n    if (!categoryId) return params\n\n    const remainingCategories = params.getAll('category').filter((cat) => cat !== categoryId)\n    params.delete('category')\n    remainingCategories.forEach((cat) => params.append('category', cat))\n    return params\n  }, [buildQuery, categoryId])\n\n"""

          marker = "  // Reflect the current filter state in the URL whenever it changes, so\n"
          if 'const buildBrowserQuery = React.useCallback' not in discovery:
              if marker not in discovery:
                  raise SystemExit('GigDiscoveryPage URL-sync marker not found')
              discovery = discovery.replace(marker, browser_query_block + marker, 1)

          if 'const qs = buildQuery().toString()' in discovery:
              discovery = discovery.replace(
                  'const qs = buildQuery().toString()',
                  'const qs = buildBrowserQuery().toString()',
                  1,
              )
          if '[buildQuery, pathname, router]' in discovery:
              discovery = discovery.replace(
                  '[buildQuery, pathname, router]',
                  '[buildBrowserQuery, pathname, router]',
                  1,
              )
          discovery_path.write_text(discovery)

          middleware_path = Path('middleware.ts')
          middleware = middleware_path.read_text()

          helper = r'''\n/** Remove a category query value that merely repeats the clean route slug. */\nfunction stripRedundantCategoryParam(url: URL): string | null {\n  const match = url.pathname.match(/^\\/categories\\/([^/]+)\\/?$/)\n  if (!match) return null\n\n  const routeCategory = decodeURIComponent(match[1])\n  const categories = url.searchParams.getAll('category')\n  if (!categories.includes(routeCategory)) return null\n\n  const remaining = categories.filter((category) => category !== routeCategory)\n  url.searchParams.delete('category')\n  remaining.forEach((category) => url.searchParams.append('category', category))\n  return url.pathname + (url.searchParams.toString() ? `?${url.searchParams}` : '')\n}\n'''

          middleware_marker = '\nexport default clerkMiddleware(\n'
          if 'function stripRedundantCategoryParam' not in middleware:
              if middleware_marker not in middleware:
                  raise SystemExit('middleware export marker not found')
              middleware = middleware.replace(middleware_marker, helper + middleware_marker, 1)

          redirect_block = """    // Category identity belongs in the path, not in a duplicate query param.\n    // Example: /categories/immigration?category=immigration ->\n    // /categories/immigration. Preserve genuinely additional filters.\n    if (hostname === MARKET_HOST && req.nextUrl.searchParams.has('category')) {\n      const cleanedCategoryUrl = stripRedundantCategoryParam(new URL(req.url))\n      if (cleanedCategoryUrl !== null) {\n        const dest = new URL(cleanedCategoryUrl, req.url)\n        return withCorsHeaders(NextResponse.redirect(dest, { status: 301 }), req)\n      }\n    }\n\n"""

          cors_marker = '    // ── CORS preflight ─────────────────────────────────────────\n'
          if 'const cleanedCategoryUrl = stripRedundantCategoryParam' not in middleware:
              if cors_marker not in middleware:
                  raise SystemExit('middleware CORS marker not found')
              middleware = middleware.replace(cors_marker, redirect_block + cors_marker, 1)

          middleware_path.write_text(middleware)
          PY

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/one-time-marketplace-category-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/marketplace/GigDiscoveryPage.tsx middleware.ts .github/workflows/one-time-marketplace-category-cleanup.yml
          git diff --cached --check
          git commit -m "Keep category identity in clean path URLs"
          git push origin HEAD:fix/marketplace-clean-category-urls-cards
