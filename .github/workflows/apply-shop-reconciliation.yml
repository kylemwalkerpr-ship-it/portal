name: Apply shop reconciliation patch

on:
  push:
    branches:
      - reconcile/shop-36-products-preserve-marketplace

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply shop reconciliation copy and admin integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical shop-only edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Keep the existing shop design intact; only correct catalogue copy.
          replace_once(
              'app/shop/FilesShop.tsx',
              """                Spreadsheets, templates, and short guides for consultants, operators, and families.\n                Checkout is on Payhip and your file arrives in the same session — no subscription,\n                no waiting on fulfilment.""",
              """                Immigration preparation packs, spreadsheets, templates, and short guides in one catalog.\n                Choose a focused download, review exactly what is included, and get access without a\n                subscription. Checkout remains securely on Payhip.""",
          )
          replace_once('app/shop/FilesShop.tsx', '<Stat n="$7–16" label="one-time USD price" />', '<Stat n="$7–79" label="one-time USD price" />')
          replace_once('app/shop/FilesShop.tsx', '<h2>Every file, ready to download</h2>', '<h2>Every file, in one catalog</h2>')
          replace_once('app/shop/FilesShop.tsx', 'placeholder="Search workbooks, resumes, planners…"', 'placeholder="Search visa packs, workbooks, planners…"')

          # Add the recovered immigration rail to the known-good Marketplace landing
          # without replacing any discovery/category/filter implementation.
          replace_once(
              'app/marketplace/PublicMarketplaceLanding.tsx',
              "import { FilesRailScroller } from '@/components/marketplace/FilesRailScroller'",
              "import { FilesRailScroller } from '@/components/marketplace/FilesRailScroller'\nimport { ImmigrationPackRail } from '@/components/marketplace/ImmigrationPackRail'",
          )
          replace_once(
              'app/marketplace/PublicMarketplaceLanding.tsx',
              """            <p className=\"kicker\">Instant downloads · $7–16 · keep the file</p>\n            <h2>Open the file shop</h2>\n            <p className=\"lede\">Workbooks, templates, and short guides. Pay once on Payhip, download immediately.</p>\n          </div>\n          <a className=\"cw-files-band-cta\" href=\"/shop\">Browse files</a>""",
              """            <p className=\"kicker\">36 instant downloads · $7–79 · secure Payhip checkout</p>\n            <h2>Preparation packs and practical files, now in one shop</h2>\n            <p className=\"lede\">Shop USA and Canada immigration organizers alongside business templates, workbooks, and short guides.</p>\n          </div>\n          <a className=\"cw-files-band-cta\" href=\"/shop\">Browse all 36 files</a>""",
          )
          replace_once(
              'app/marketplace/PublicMarketplaceLanding.tsx',
              """      <section className=\"cw-files-rail\" aria-label=\"Instant-download file shop\">""",
              """      <section className=\"cw-files-rail\" aria-label=\"Immigration preparation packs\">\n        <div className=\"wrap\">\n          <div className=\"cw-files-rail-head\">\n            <h2>Immigration preparation packs</h2>\n            <a href=\"/shop\">See the complete shop →</a>\n          </div>\n          <ImmigrationPackRail />\n        </div>\n      </section>\n\n      <section className=\"cw-files-rail\" aria-label=\"Instant-download file shop\">""",
          )

          # Surface the source-controlled 36-product Payhip catalogue inside the
          # existing admin Templates view while preserving its DB-backed editor.
          replace_once(
              'components/design/admin-templates.tsx',
              "import React from 'react'",
              "import React from 'react'\nimport AdminShopCatalogue from './admin-shop-catalog'",
          )
          replace_once(
              'components/design/admin-templates.tsx',
              '      {/* Templates table */}',
              '      <AdminShopCatalogue />\n\n      {/* Templates table */}',
          )
          PY

      - name: Commit surgical reconciliation
        run: |
          git config user.name "YouSafe Reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add app/shop/FilesShop.tsx app/marketplace/PublicMarketplaceLanding.tsx components/design/admin-templates.tsx
          git diff --cached --check
          git commit -m "Apply shop reconciliation copy and admin integration"
          git push origin HEAD:reconcile/shop-36-products-preserve-marketplace
