name: Reconcile Payment Incidents

# Runs hourly: retries failed provider-earning credits and reports any open
# incidents (charge/debit without order) that need manual reconciliation.
# Can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: '15 * * * *'   # hourly at :15
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger incident reconciliation
        run: |
          set -euo pipefail
          URL="${PORTAL_URL:-https://portal.yousafeconsultancy.com}/api/cron/reconcile-incidents"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $code"; cat /tmp/resp.json || true
          test "$code" = "200"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
