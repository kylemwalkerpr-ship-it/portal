name: Apply Bing SEO patch

on:
  push:
    branches:
      - seo/bing-metadata-alt-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[seo-patch-applied]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/bing-metadata-alt-cleanup
          fetch-depth: 0
      - name: Apply exact SEO substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_one(
              'app/shop/[slug]/page.tsx',
              "const SHOP_CANONICAL = 'https://market.yousafeconsultancy.com/shop'\n",
              "const SHOP_CANONICAL = 'https://market.yousafeconsultancy.com/shop'\n\nconst SHOP_SEO_TITLES: Record<string, string> = {\n  'us-f1-student-visa-ds160-i20-pack': 'F-1 Visa DS-160 + I-20 Prep Pack | YouSafe',\n  'canada-study-permit-complete-pack': 'Canada Study Permit Prep Pack | YouSafe',\n}\n",
          )
          replace_one(
              'app/shop/[slug]/page.tsx',
              "  const title = `${product.name} | YouSafe File Shop`",
              "  const title = SHOP_SEO_TITLES[slug] ?? `${product.name} | YouSafe File Shop`",
          )
          replace_one(
              'app/shop/FilesShop.tsx',
              '<img src={product.cover} alt="" width={1200} height={1600} />',
              '<img src={product.cover} alt={`${product.title} cover`} width={1200} height={1600} />',
          )
          PY
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/shop/[slug]/page.tsx' app/shop/FilesShop.tsx
          git diff --cached --check
          git commit -m 'fix(seo): [seo-patch-applied] shorten shop titles and label covers'
          git push origin HEAD:seo/bing-metadata-alt-cleanup
