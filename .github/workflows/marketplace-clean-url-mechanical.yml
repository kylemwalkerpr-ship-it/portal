# One-time branch-only sweep. Delete this workflow before merge.
name: Marketplace retired URL estate audit

on:
  push:
    branches:
      - sanitize/marketplace-clean-url-estate
    paths:
      - '.github/workflows/marketplace-clean-url-mechanical.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize/marketplace-clean-url-estate
          fetch-depth: 0

      - name: Clean final discovered emitters
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
            'components/marketplace/HeroCaseFileSlideshow.tsx': [
              ('`/marketplace/gigs/${slide.slug}`', '`/gigs/${slide.slug}`'),
              ("withCountry('/marketplace?sort=most_orders'", "withCountry('/?sort=most_orders'"),
            ],
            'components/marketplace/FeaturedBriefsGrid.tsx': [
              ('`/marketplace/gigs/${g.slug}`', '`/gigs/${g.slug}`'),
              ('`/marketplace?category=${g.category ? (LEGACY_CATEGORY_MAP[g.category] || normalizeCategory(g.category)) : \'\'}`', '`/?category=${g.category ? (LEGACY_CATEGORY_MAP[g.category] || normalizeCategory(g.category)) : \'\'}`'),
              ('`/marketplace?page=${deepestPage - 1}`', '`/?page=${deepestPage - 1}`'),
              ('`/marketplace?page=${p}`', '`/?page=${p}`'),
              ('`/marketplace?page=${deepestPage + 1}`', '`/?page=${deepestPage + 1}`'),
            ],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              text = text.replace(old, new)
            path.write_text(text)
          PY

      - name: Scan runtime URL literals
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('components'), Path('lib')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.css', '.mjs', '.cjs'}
          allowed_files = {
            Path('app/sitemap.ts'),
            Path('components/auth-shell.tsx'),
            Path('lib/marketplaceSeo.ts'),
          }
          direct_literal = re.compile(r"['\"`]/marketplace(?=[/?'\"`])")
          absolute_legacy = re.compile(r"market\.yousafeconsultancy\.com/marketplace(?=[/?'\"`])")
          failures = []
          for root in roots:
            for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in extensions or path in allowed_files:
                continue
              for i, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                stripped = line.strip()
                if stripped.startswith('//') or stripped.startswith('*') or stripped.startswith('/*'):
                  continue
                scrubbed = line.replace('/api/marketplace', '/api/__marketplace_internal')
                if direct_literal.search(scrubbed) or absolute_legacy.search(scrubbed):
                  failures.append(f'{path}:{i}: {stripped}')
          if failures:
            print('Retired public Marketplace URL literals remain in runtime code:')
            print('\n'.join(failures))
            raise SystemExit(1)
          print('Estate-wide runtime scan is clean.')
          PY

      - name: Commit final discovered emitters
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No additional changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/marketplace/HeroCaseFileSlideshow.tsx components/marketplace/FeaturedBriefsGrid.tsx
          git commit -m 'Remove final Marketplace-prefixed card links'
          git push origin HEAD:sanitize/marketplace-clean-url-estate
