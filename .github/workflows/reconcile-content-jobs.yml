# ── Content Jobs Reconcile Cron ──────────────────────────────────────────
# Self-healing pass for content_jobs that fell out of the live pipeline.
# Picks up stuck 'drafting' rows, stale 'failed' rows with retry budget, and
# orphan PRs, then stages them so the content-studio-retry cron can act
# deterministically on the next tick. Runs right before the retry cron.
#
# Schedule: every 15 minutes (at :00/:15/:30/:45), paired with retry.
# ───────────────────────────────────────────────────────────────────────────

name: reconcile-content-jobs

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes
  workflow_dispatch:          # Manual trigger for debugging

jobs:
  reconcile-jobs:
    runs-on: ubuntu-latest
    # The route replays a bounded batch (BATCH_SIZE=5) live; the 15-min job
    # timeout plus an aggressive curl bound is the belt-and-braces wall.
    timeout-minutes: 15

    steps:
      - name: Reconcile stuck / failed content jobs
        run: |
          set -euo pipefail

          RESPONSE=$(curl -s --max-time 810 -w '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ vars.PORTAL_URL }}/api/cron/reconcile-content-jobs" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: API returned HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          # Log summary for quick inspection
          STUCK=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('stuckDrafting', 0))" 2>/dev/null || echo "?")
          RETRIED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('failedRetried', 0))" 2>/dev/null || echo "?")
          FAILED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('failedReachedMax', 0))" 2>/dev/null || echo "?")
          ORPHANS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('orphans', 0))" 2>/dev/null || echo "?")
          echo "--- Summary: stuck=$STUCK retried=$RETRIED failed=$FAILED orphans=$ORPHANS ---"