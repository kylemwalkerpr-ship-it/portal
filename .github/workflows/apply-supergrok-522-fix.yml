name: Apply SuperGrok 522 fix

on:
  push:
    branches:
      - fix/supergrok-cloudflare-522

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/supergrok-cloudflare-522
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-supergrok-522-fix.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix SuperGrok Cloudflare 522 transport"
          git push origin HEAD:fix/supergrok-cloudflare-522
