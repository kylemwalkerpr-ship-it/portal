name: Apply pending production safeguards

on:
  push:
    branches:
      - chore/reconcile-pending-production-safeguards
    paths:
      - scripts/apply-pending-production-safeguards.mjs
      - .github/workflows/apply-pending-production-safeguards.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/reconcile-pending-production-safeguards
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply deterministic patch
        run: node scripts/apply-pending-production-safeguards.mjs

      - name: Verify intended regression contracts
        run: |
          npx jest --runInBand tests/bing-seo-warning-regression.test.ts tests/legacy-marketplace-redirect-contract.test.ts tests/github-only-production-deploy.test.ts

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shop/FilesShop.tsx app/shop/'[slug]'/page.tsx next.config.ts package.json scripts/deploy-production.mjs AGENTS.md
          git diff --cached --check
          git commit -m "fix: reconcile pending production safeguards"
          git push origin HEAD:chore/reconcile-pending-production-safeguards
