name: Apply truthful category membership patch

on:
  push:
    branches:
      - seo/marketplace-truthful-category-membership

permissions:
  contents: write

concurrency:
  group: portal-category-membership-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: seo/marketplace-truthful-category-membership

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply narrow category filter patch
        run: node scripts/apply-truthful-category-filter-patch.mjs

      - name: Commit patched sources when changed
        shell: bash
        run: |
          if git diff --quiet -- lib/categories.ts lib/marketplaceFacets.ts app/api/marketplace/gigs/route.ts tests/marketplace-gigs-search.test.ts tests/marketplace-facets.test.ts; then
            echo "No category membership changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/categories.ts lib/marketplaceFacets.ts app/api/marketplace/gigs/route.ts tests/marketplace-gigs-search.test.ts tests/marketplace-facets.test.ts
          git commit -m "fix(seo): make Marketplace category membership truthful"
          git push origin HEAD:seo/marketplace-truthful-category-membership
