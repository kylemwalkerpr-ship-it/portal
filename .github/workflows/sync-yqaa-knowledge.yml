name: Export YQAA public snapshot for Modal validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export public knowledge only
        env:
          SNAPSHOT_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SNAPSHOT_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/export-yqaa-modal-validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: yqaa-public-snapshot
          path: /tmp/yqaa-public-snapshot/
          retention-days: 3
