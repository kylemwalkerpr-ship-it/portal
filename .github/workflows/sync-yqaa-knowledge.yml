name: Bounded YQAA provider connectivity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe configured first-party Grok credential without storing content
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: |
          node <<'JS'
          (async () => {
            const start=Date.now();
            const settingsResponse=await fetch(process.env.SUPABASE_URL+'/rest/v1/ai_settings?select=key,value&key=in.(xai_oauth_access_token,xai_oauth_expires_at)',{
              headers:{apikey:process.env.SUPABASE_KEY,Authorization:'Bearer '+process.env.SUPABASE_KEY},signal:AbortSignal.timeout(5000),
            });
            if (!settingsResponse.ok) throw Error('settings_unavailable');
            const settings=Object.fromEntries((await settingsResponse.json()).map(x=>[x.key,x.value]));
            const key=settings.xai_oauth_access_token;
            if (!key || Number(settings.xai_oauth_expires_at)<=Date.now()) throw Error('subscription_credential_expired');
            try {
              const response=await fetch('https://api.x.ai/v1/responses', {
                method:'POST',redirect:'manual',signal:AbortSignal.timeout(25000),
                headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
                body:JSON.stringify({model:'grok-4.6',reasoning:{effort:'low'},max_output_tokens:1200,store:false,
                  input:[{role:'user',content:'Give three questions to ask before choosing a public service provider.'}]}),
              });
              const data=await response.json().catch(()=>null);
              const content=!!(data?.output_text || data?.output?.some(x=>x.type==='message' && x.content?.some(c=>c.text)));
              const errorText=JSON.stringify(data?.error || data || {});
              const category=/credit|balance|billing|payment|fund/i.test(errorText)?'billing':/key|token|credential|authentication|unauthorized/i.test(errorText)?'credential':/model|permission|access|forbidden/i.test(errorText)?'access':'other';
              console.log(JSON.stringify({status:response.status,ms:Date.now()-start,content,category,completion:['completed','incomplete','failed'].includes(data?.status)?data.status:'unknown'}));
              if (!response.ok || !content) process.exitCode=1;
            } catch { console.log(JSON.stringify({status:'network_or_timeout',ms:Date.now()-start}));process.exitCode=1; }
          })();
          JS
