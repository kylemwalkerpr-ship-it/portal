name: Apply SuperGrok quota diagnostics patch

on:
  push:
    branches:
      - fix/supergrok-build-quota-errors

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted quota diagnostics
        run: python scripts/apply-supergrok-quota-fix.py
      - name: Commit targeted code changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/contentAiProvider.ts tests/grok-responses-brief.test.ts
          git commit -m 'fix: surface SuperGrok Build usage exhaustion'
          git push origin HEAD
