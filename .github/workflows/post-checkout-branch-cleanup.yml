name: Post-checkout merged branch cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/post-checkout-branch-cleanup.yml'
      - '.github/post-checkout-branch-cleanup-trigger'
  push:
    branches: [main]
    paths:
      - '.github/post-checkout-branch-cleanup-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit and prune only exact merged PR heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name != 'push' }}
          CURRENT_PR_HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          const repository = process.env.GITHUB_REPOSITORY
          const [owner] = repository.split('/')
          const token = process.env.GH_TOKEN
          const dryRun = process.env.DRY_RUN === 'true'
          const currentPrHead = process.env.CURRENT_PR_HEAD || ''
          if (!repository || !owner || !token) throw new Error('Missing GitHub workflow context')

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'yousafe-post-checkout-branch-cleanup',
          }

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            })
            const text = await response.text()
            let body = null
            if (text) {
              try { body = JSON.parse(text) } catch { body = text }
            }
            if (!response.ok) {
              const error = new Error(`${options.method || 'GET'} ${path} -> ${response.status}`)
              error.status = response.status
              error.body = body
              throw error
            }
            return body
          }

          async function paginate(path) {
            const separator = path.includes('?') ? '&' : '?'
            const rows = []
            for (let page = 1; page <= 10; page += 1) {
              const batch = await api(`${path}${separator}per_page=100&page=${page}`)
              rows.push(...batch)
              if (batch.length < 100) break
            }
            return rows
          }

          async function main() {
            const branches = await paginate(`/repos/${repository}/branches`)
            const openPrs = await paginate(`/repos/${repository}/pulls?state=open`)
            const openHeads = new Set(
              openPrs
                .filter((pr) => pr.head?.repo?.full_name === repository)
                .map((pr) => pr.head.ref),
            )

            const wouldDelete = []
            const deleted = []
            const preservedOpen = []
            const preservedUnproven = []

            for (const branch of branches) {
              const name = branch.name
              if (name === 'main' || branch.protected) continue
              if (dryRun && currentPrHead && name === currentPrHead) continue

              // Open work is authoritative. This protects PR #126 and every other
              // currently open same-repository PR before any cleanup decision.
              if (openHeads.has(name)) {
                preservedOpen.push(name)
                continue
              }

              const query = new URLSearchParams({
                head: `${owner}:${name}`,
                state: 'closed',
              })
              const prs = await paginate(`/repos/${repository}/pulls?${query}`)
              const exactMerged = prs.find(
                (pr) => pr.merged_at && pr.head?.sha === branch.commit.sha,
              )

              // Fail-safe rule: no exact merged-PR proof, no deletion. This avoids
              // removing active empty branches or branches with post-merge work.
              if (!exactMerged) {
                preservedUnproven.push(name)
                continue
              }

              const row = `${name} — exact head of merged PR #${exactMerged.number}`
              wouldDelete.push(row)
              if (dryRun) continue

              const refPath = name.split('/').map(encodeURIComponent).join('/')
              await api(`/repos/${repository}/git/refs/heads/${refPath}`, { method: 'DELETE' })
              deleted.push(row)
            }

            const actionRows = dryRun ? wouldDelete : deleted
            const summary = [
              `# Post-checkout branch cleanup${dryRun ? ' — dry run' : ''}`,
              '',
              `${dryRun ? 'Would delete' : 'Deleted'}: ${actionRows.length}`,
              `Preserved open PR heads: ${preservedOpen.length}`,
              `Preserved without exact merged-PR proof: ${preservedUnproven.length}`,
              '',
              `## ${dryRun ? 'Would delete' : 'Deleted'}`,
              ...(actionRows.length ? actionRows.map((x) => `- ${x}`) : ['- None']),
              '',
              '## Preserved open PR heads',
              ...(preservedOpen.length ? preservedOpen.map((x) => `- ${x}`) : ['- None']),
              '',
              '## Preserved — no exact merged-PR proof',
              ...(preservedUnproven.length ? preservedUnproven.map((x) => `- ${x}`) : ['- None']),
              '',
            ].join('\n')

            console.log(summary)
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
