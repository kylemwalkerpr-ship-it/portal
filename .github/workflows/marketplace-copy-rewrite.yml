name: Rewrite Marketplace Copy

on:
  workflow_run:
    workflows: ["Deploy YouSafe Portal"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: marketplace-copy-rewrite-production
  cancel-in-progress: false

jobs:
  rewrite:
    name: Rewrite active gigs and provider profiles
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check one-time Marketplace rewrite marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/marketplace-copy-rewrite.enabled ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Marketplace copy rewrite marker is enabled for this deployed commit."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Marketplace copy rewrite marker is absent; no-op."
          fi

      - name: Set up Node
        if: steps.marker.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.marker.outputs.enabled == 'true'
        run: npm ci --legacy-peer-deps

      - name: Verify gig images before copy rewrite
        if: steps.marker.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: node scripts/verify-marketplace-image-preservation.mjs

      - name: Rewrite and audit Marketplace copy
        if: steps.marker.outputs.enabled == 'true'
        env:
          MARKETPLACE_COPY_REWRITE: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          ENTRIM_API_KEY: ${{ secrets.ENTRIM_API_KEY }}
          ENTRIM_BASE_URL: ${{ secrets.ENTRIM_BASE_URL }}
        run: node scripts/run-marketplace-copy-rewrite.mjs

      - name: Verify gig images after copy rewrite
        if: always() && steps.marker.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: node scripts/verify-marketplace-image-preservation.mjs
