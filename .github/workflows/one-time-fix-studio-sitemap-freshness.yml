name: One-time Studio sitemap freshness patch

on:
  push:
    branches:
      - seo/retire-checkout-estate
    paths:
      - '.github/workflows/one-time-fix-studio-sitemap-freshness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/retire-checkout-estate
          fetch-depth: 0
      - name: Remove synthetic freshness from generated Portal sitemap entries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'lib/seoFactory/siteHealth.ts'
          const src = fs.readFileSync(file, 'utf8')
          const from = "...STUDIO_SITEMAP_ROUTES.map((path: string) => ({ url: `${base}${mp(path)}`, lastModified: new Date(), changeFrequency: 'weekly' as const, priority: 0.55 })),"
          const to = "...STUDIO_SITEMAP_ROUTES.map((path: string) => ({ url: `${base}${mp(path)}`, changeFrequency: 'weekly' as const, priority: 0.55 })),"
          if (!src.includes(from)) throw new Error('Expected Portal Studio sitemap insertion was not found')
          fs.writeFileSync(file, src.replace(from, to))
          NODE
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/seoFactory/siteHealth.ts
          git commit -m 'Stop SEO Factory from synthesizing sitemap freshness'
          git push origin HEAD:seo/retire-checkout-estate
