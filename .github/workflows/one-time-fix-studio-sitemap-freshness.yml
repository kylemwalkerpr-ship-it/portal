name: One-time Studio sitemap freshness patch

on:
  push:
    branches:
      - seo/retire-checkout-estate
    paths:
      - '.github/workflows/one-time-fix-studio-sitemap-freshness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/retire-checkout-estate
          fetch-depth: 0
      - name: Remove synthetic freshness from generated Portal sitemap entries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'lib/seoFactory/siteHealth.ts'
          const src = fs.readFileSync(file, 'utf8')
          const from = ", lastModified: new Date(), changeFrequency: 'weekly' as const"
          const to = ", changeFrequency: 'weekly' as const"
          const occurrences = src.split(from).length - 1
          if (occurrences !== 1) {
            throw new Error(`Expected exactly one synthetic Portal sitemap freshness fragment, found ${occurrences}`)
          }
          fs.writeFileSync(file, src.replace(from, to))
          NODE
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/seoFactory/siteHealth.ts
          git commit -m 'Stop SEO Factory from synthesizing sitemap freshness'
          git push origin HEAD:seo/retire-checkout-estate
