name: Adopt Migration Ledger Baseline

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: '40-hex main commit to execute (pins the checkout)'
        required: true
        type: string
      confirmation:
        description: 'Type ADOPT-BASELINE-69 to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seo-factory-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adopt:
    name: Adopt forward-only migration ledger baseline
    runs-on: ubuntu-latest
    environment: migration-ledger-adoption
    steps:
      # First step, before checkout and before any secret is exposed: a non-main
      # or bad-confirmation dispatch must FAIL this workflow, never skip the job.
      # Dispatch values arrive via env and are referenced only as quoted shell
      # variables, never interpolated into the script text (shell-injection safe).
      - name: Refuse unless dispatched from main with exact confirmation
        env:
          GITHUB_REF: ${{ github.ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRMATION}" = "ADOPT-BASELINE-69"
          echo "dispatch guard passed"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          # Full history is required: the adoption CLI re-runs the manifest
          # baseline ancestry proof, which a depth-1 shallow boundary breaks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # runAdoption() owns the authoritative manifest-baseline ancestry proof
      # (git merge-base --is-ancestor <baseline> HEAD). This step only asserts
      # that the pinned checkout is the expected commit and is on main.
      - name: Verify pinned checkout is a commit on main
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${EXPECTED_MAIN_SHA}" origin/main

      - name: Adopt baseline ledger (writes ledger rows only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing Supabase access token repository secret"
            exit 1
          fi
          node scripts/adopt-migration-ledger.mjs
