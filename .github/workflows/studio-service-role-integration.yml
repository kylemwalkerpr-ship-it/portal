name: Studio service-role integration

on:
  pull_request:
    paths:
      - '.github/workflows/studio-service-role-integration.yml'
      - 'ci/supabase/**'
      - 'lib/supabase.ts'
      - 'lib/supabaseKey.ts'
      - 'lib/seoEngine/gate.ts'
      - 'lib/seoFactory/specialistFeeds.ts'
      - 'tests/supabase-service-role.integration.test.ts'
      - 'tests/studio-service-role-image-receipt.test.ts'
      - 'scripts/studio-service-role-image-receipt.cjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-service-role-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify against isolated local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Full SHAs keep third-party workflow code immutable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.98.2

      - name: Install locked application dependencies
        run: npm ci

      - name: Start the pinned isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          # Supabase config.toml resolves auth.jwt_secret through env(). Keep
          # the run-specific value out of stdout and persist only in GITHUB_ENV.
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          export SUPABASE_AUTH_JWT_SECRET="$jwt_secret"
          printf 'SUPABASE_AUTH_JWT_SECRET=%s\n' "$jwt_secret" >>"$GITHUB_ENV"
          unset jwt_secret
          stack_log="$RUNNER_TEMP/studio-supabase-start.log"
          if ! (cd ci/supabase && supabase start) >"$stack_log" 2>&1; then
            echo 'Local Supabase startup failed; raw stack output withheld.'
            exit 1
          fi
          container_names_file="$RUNNER_TEMP/studio-supabase-container-names.txt"
          docker ps --all --filter 'label=com.supabase.cli.project=yousafe-studio-service-role-ci' --format '{{.Names}}' >"$container_names_file"
          mapfile -t container_names <"$container_names_file"
          if ((${#container_names[@]} == 0)); then
            echo 'No Supabase stack containers found; image receipt was not written.'
            exit 1
          fi
          projection_file="$RUNNER_TEMP/studio-supabase-image-projection.json"
          receipt_file="$RUNNER_TEMP/studio-supabase-image-receipt.json"
          container_projection_file="$RUNNER_TEMP/studio-supabase-container-projection.json"
          image_ids_file="$RUNNER_TEMP/studio-supabase-image-ids.txt"
          image_projection_file="$RUNNER_TEMP/studio-supabase-image-inspect-projection.json"
          if ! docker inspect "${container_names[@]}" 2>"$RUNNER_TEMP/studio-supabase-container-inspect.err" |
            jq '[.[] | {name: .Name, image: .Config.Image, imageId: .Image}]' >"$container_projection_file" 2>"$RUNNER_TEMP/studio-supabase-jq.err"; then
            echo 'Unable to create sanitized Docker container projection; Docker output withheld.'
            exit 1
          fi
          jq -r '.[].imageId' "$container_projection_file" | sort -u >"$image_ids_file"
          mapfile -t image_ids <"$image_ids_file"
          if ((${#image_ids[@]} == 0)); then
            echo 'No immutable image IDs found; image receipt was not written.'
            exit 1
          fi
          if ! docker image inspect "${image_ids[@]}" 2>"$RUNNER_TEMP/studio-supabase-image-inspect.err" |
            jq '[.[] | {id: .Id, repoDigests: (.RepoDigests // [])}]' >"$image_projection_file" 2>"$RUNNER_TEMP/studio-supabase-image-jq.err"; then
            echo 'Unable to inspect referenced Docker images; image output withheld.'
            exit 1
          fi
          if ! jq -n --slurpfile containers "$container_projection_file" --slurpfile images "$image_projection_file" \
            '{containers: $containers[0], images: $images[0]}' >"$projection_file"; then
            echo 'Unable to join sanitized Docker projections; output withheld.'
            exit 1
          fi
          GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          SUPABASE_CLI_VERSION='2.98.2' \
            node scripts/studio-service-role-image-receipt.cjs "$projection_file" "$receipt_file"
          echo "STUDIO_SUPABASE_IMAGE_RECEIPT=$receipt_file" >>"$GITHUB_ENV"
          env_file="$RUNNER_TEMP/studio-supabase.env"
          (cd ci/supabase && supabase status -o env) >"$env_file"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const values = Object.fromEntries(readFileSync(process.env.SUPABASE_ENV_FILE, 'utf8')
            .split(/\r?\n/)
            .map((line) => line.match(/^([A-Z_]+)="?(.*?)"?$/))
            .filter(Boolean)
            .map((match) => [match[1], match[2]]))
          for (const name of ['API_URL', 'ANON_KEY', 'SERVICE_ROLE_KEY']) {
            if (!values[name]) throw new Error(`local stack omitted ${name}`)
          }
          appendFileSync(process.env.GITHUB_ENV,
            `NEXT_PUBLIC_SUPABASE_URL=${values.API_URL}\n` +
            `NEXT_PUBLIC_SUPABASE_ANON_KEY=${values.ANON_KEY}\n` +
            `SUPABASE_SERVICE_ROLE_JWT=${values.SERVICE_ROLE_KEY}\n`)
          console.log('Local Supabase stack ready; credentials withheld.')
          NODE
        env:
          SUPABASE_ENV_FILE: ${{ runner.temp }}/studio-supabase.env

      - name: Upload sanitized Supabase image receipt
        if: always() && env.STUDIO_SUPABASE_IMAGE_RECEIPT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-supabase-image-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STUDIO_SUPABASE_IMAGE_RECEIPT }}
          if-no-files-found: error
          retention-days: 14

      - name: Exercise real service-role gate and specialist operations
        run: npm run test:supabase-service-role-integration

      - name: Stop the local stack
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            (cd ci/supabase && supabase stop --no-backup) >/dev/null 2>&1 || true
          fi
          echo 'Local Supabase teardown complete; stack credentials and raw logs withheld.'
