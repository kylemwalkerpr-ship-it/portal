name: Apply marketplace nav and media patch

on:
  push:
    branches:
      - fix/marketplace-nav-and-media-resilience

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[marketplace-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/marketplace-nav-and-media-resilience
          fetch-depth: 0

      - name: Apply targeted source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('components/marketplace/MarketplaceShell.tsx')
          shell = shell_path.read_text()
          old_mobile = "const homeCurrent = !shopActive && activeView === 'browse'"
          new_mobile = "const homeCurrent = role === null && !shopActive && activeView === 'browse'"
          if old_mobile not in shell:
              raise SystemExit('mobile Home active-state target not found')
          shell = shell.replace(old_mobile, new_mobile, 1)

          old_desktop = "? !shopActive && activeView === 'browse'"
          new_desktop = "? role === null && !shopActive && activeView === 'browse'"
          if old_desktop not in shell:
              raise SystemExit('desktop Home active-state target not found')
          shell = shell.replace(old_desktop, new_desktop, 1)
          shell_path.write_text(shell)

          landing_path = Path('app/marketplace/PublicMarketplaceLanding.tsx')
          landing = landing_path.read_text()
          import_anchor = "import { ImmigrationPackRail } from '@/components/marketplace/ImmigrationPackRail'"
          media_import = "import { HeroBackgroundMedia } from '@/components/marketplace/HeroBackgroundMedia'"
          if media_import not in landing:
              if import_anchor not in landing:
                  raise SystemExit('hero media import anchor not found')
              landing = landing.replace(import_anchor, import_anchor + '\n' + media_import, 1)

          old_video = (
              '          <video autoPlay muted loop playsInline preload="auto" poster="/hero-poster.jpg">\n'
              '            <source src="/hero-bg.mp4" type="video/mp4" />\n'
              '          </video>'
          )
          new_video = '          <HeroBackgroundMedia />'
          if old_video not in landing:
              raise SystemExit('hero video target not found')
          landing = landing.replace(old_video, new_video, 1)
          landing_path.write_text(landing)
          PY

      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-marketplace-nav-media-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/marketplace/MarketplaceShell.tsx app/marketplace/PublicMarketplaceLanding.tsx .github/workflows/apply-marketplace-nav-media-fix.yml
          git commit -m "fix: clean marketplace nav state and harden hero media [marketplace-fix-applied]"
          git push origin HEAD:fix/marketplace-nav-and-media-resilience
