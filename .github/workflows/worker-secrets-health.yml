name: Worker Secrets Health (hourly)

# Every hour, verify the Cloudflare Worker still has CLERK_SECRET_KEY and
# SUPABASE_SERVICE_ROLE_KEY (and that both work against their APIs). If
# either went missing (the "all profiles look like new users" regression),
# the route emails ops AND this workflow fails so GitHub notifies too.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger worker secrets health check
        run: |
          set -euo pipefail
          URL="${PORTAL_URL:-https://portal.yousafeconsultancy.com}/api/cron/worker-secrets-health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" || true)
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          python3 - <<'PY'
          import json
          try:
            with open('/tmp/health.json') as f:
              d = json.load(f)
          except Exception as e:
            print('Could not parse health response:', e)
            raise SystemExit(1)
          if not d.get('ok'):
            print('WORKER SECRETS UNHEALTHY:', d.get('failures'))
            raise SystemExit(1)
          print('Worker secrets healthy')
          PY
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
