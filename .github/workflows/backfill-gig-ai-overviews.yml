name: Backfill Gig AI Overviews

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing ai_overview (GIG_AI_OVERVIEW_FORCE=1)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Generate but do not write (GIG_AI_OVERVIEW_DRY_RUN=1)'
        required: false
        default: false
        type: boolean
      slugs:
        description: 'Comma-separated gig slugs'
        required: false
        default: 'review-i765-opt-application-before-filing,provide-immigration-expert-lawyer-services,proofread-thesis-dissertation-grammar-consistency,edit-thesis-admissions-essay-us-university-applications,edit-dissertation-research-paper-us-graduate-school'
        type: string

permissions:
  contents: read

concurrency:
  group: backfill-gig-ai-overviews
  cancel-in-progress: false

jobs:
  backfill:
    name: Curate and write gig ai_overview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Backfill curated AI overviews
        env:
          GIG_AI_OVERVIEW_BACKFILL: '1'
          GIG_AI_OVERVIEW_FORCE: ${{ inputs.force && '1' || '' }}
          GIG_AI_OVERVIEW_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          GIG_AI_OVERVIEW_SLUGS: ${{ inputs.slugs }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ secrets.XAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx scripts/backfill-gig-ai-overviews.mts
