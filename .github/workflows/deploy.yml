name: Deploy YouSafe Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: yousafe-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Quality gate: typecheck + unit tests must pass before anything ships.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npx jest --ci

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }

      # Build needs the NEXT_PUBLIC_ values that Next.js inlines into the
      # client bundle. wrangler.toml has them as plaintext [vars]; we mirror
      # the same values here so the CI build matches the deployed runtime.
      #
      # Build ALSO needs the server-only service-role credentials: the public
      # Marketplace estate is enumerated at build time (SSG +
      # `dynamicParams = false`), and public.gigs is not anon-readable. With
      # only the anon key the build silently saw ZERO active gigs and baked a
      # false-empty landing + a 404-ing /gigs/<slug> estate (see
      # lib/marketplaceBuildAuthority.ts, which now fails that build closed).
      # These stay server-only: never NEXT_PUBLIC_, never echoed.
      - name: Build (Next + OpenNext)
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_JS_VERSION: '6.32.0'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      # Official OpenNext static-assets incremental cache. `opennextjs-cloudflare
      # deploy` would run the adapter's populateStaticAssetsIncrementalCache hook
      # for us, but this repo deploys through raw `wrangler deploy` instead, so
      # the equivalent local `fs.cpSync(.open-next/cache ->
      # .open-next/assets/cdn-cgi/_next_cache)` is run explicitly BEFORE the
      # deploy publishes .open-next/assets. Local filesystem only: no network,
      # no Cloudflare API, no credentials, and no paid-plan infrastructure.
      # Fails closed if the build emitted no prerender cache, so a stale or
      # empty static incremental cache can never ship silently.
      #
      # Portal root gate: portal.yousafeconsultancy.com/ is the Cloudflare 1102
      # route. It is served the same way as the market host — anonymous
      # documents skip Clerk (lib/portalMiddlewareBypass.ts) and cache
      # interception answers from this published cache — so the deploy must not
      # ship without a portal root document entry. The key is discovered from
      # the build output and the published payloads (never guessed here); the
      # verifier prints the exact key so a green run can pin it in the list
      # above. Any failure fails the step (no continue-on-error).
      - name: Populate static incremental cache (local copy, no network)
        run: |
          npm run populate:static-incremental-cache
          node scripts/verify-portal-root-static-cache.mjs
          # Auth-lane gate (MARKET-PORTAL-AUTH-HANDOFF-1102 R2): the
          # /sign-in/** + /sign-up/** documents were the last portal documents
          # rendered per request (503 `error code: 1102` on a Workers Free
          # isolate — live ray a3e83a202c58724a). They now ship as prebuilt
          # shells, so the deploy fails closed unless every lane document is
          # published with its own document text in the cache and the pages
          # still carry `force-static` + generateStaticParams and no
          # request-time server work.
          node scripts/verify-portal-auth-lane-static-cache.mjs
          BUILD_ID="$(cat .next/BUILD_ID)"
          for cache_key in \
            marketplace \
            marketplace/gigs \
            marketplace/categories \
            marketplace/providers \
            shop
          do
            cache_file=".open-next/assets/cdn-cgi/_next_cache/${BUILD_ID}/${cache_key}.cache"
            test -f "$cache_file" || {
              echo "::error::Missing required prerender cache asset: $cache_file"
              exit 1
            }
          done
          # Gig-detail estate gate: /gigs/[slug] is `dynamicParams = false`, so
          # a build that emitted no concrete gig slugs publishes a 404 for
          # every live gig URL. Require at least one real `<slug>.cache` entry
          # beneath the marketplace/gigs/ prerender directory — the check is
          # generic (never a hardcoded slug), recursive, and fails closed.
          GIG_DETAIL_CACHE_DIR=".open-next/assets/cdn-cgi/_next_cache/${BUILD_ID}/marketplace/gigs"
          test -d "$GIG_DETAIL_CACHE_DIR" || {
            echo "::error::Missing gig-detail prerender cache directory: $GIG_DETAIL_CACHE_DIR"
            exit 1
          }
          GIG_DETAIL_CACHE_COUNT="$(find "$GIG_DETAIL_CACHE_DIR" -type f -name '*.cache' | wc -l | tr -d ' ')"
          test "$GIG_DETAIL_CACHE_COUNT" -gt 0 || {
            echo "::error::No gig-detail prerender cache files beneath $GIG_DETAIL_CACHE_DIR — live /gigs/<slug> URLs would 404 (dynamicParams=false)."
            exit 1
          }
          echo "Verified critical Marketplace prerender cache assets for build ${BUILD_ID} (${GIG_DETAIL_CACHE_COUNT} gig-detail entries)."

      # MARKET-ROOT-TRANSFER-LATENCY payload budget gate. The market root is
      # served from the static incremental cache, and the PRE-FIX document was
      # 524,455 bytes because the landing serialized the whole active inventory
      # (~217 brief records, twice) and rendered its stylesheet as an inline
      # <style> element. This step reads the PUBLISHED cache entry (the exact
      # bytes the Worker will serve) and fails closed if the document exceeds
      # its budget, drops below the required reduction, stops shipping exactly
      # one crawlable page of brief cards, re-inlines the stylesheet, or links a
      # stylesheet that was not published with the assets.
      - name: Market-root payload budget gate
        run: node scripts/verify-market-landing-payload.mjs

      - name: SEO audit guard (report-only)
        continue-on-error: true
        run: |
          echo "::group::Portal SEO Audit Guard"
          node scripts/seo-audit-guard.mjs
          echo "::endgroup::"

      # Every Worker secret the old per-secret sync loop pushed is written to
      # ONE ephemeral JSON file and passed atomically to
      # `wrangler deploy --secrets-file` in the deploy step below. Secrets
      # and code therefore land in the SAME Worker Version: no post-deploy
      # secret-push race, and secrets not present in the file are preserved
      # by Cloudflare. The deploy credential CLOUDFLARE_API_TOKEN is
      # deliberately NOT in this step's env and is never written to the
      # runtime secret file. CONTENT_AI_PROVIDER stays pinned LITERALLY to
      # the commissioned registry default ('grok') so a leftover/rotated
      # GitHub secret cannot re-pin a retired host ahead of a code deploy.
      # The file is mode 0600 under RUNNER_TEMP, values are never printed,
      # and an `if: always()` step deletes it after the deploy.
      - name: Prepare Worker secrets file (ephemeral, atomic deploy)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # Content Studio AI — exactly two commissioned providers with no
          # cross-provider fallback: Grok 4.6 (retained xAI transport) and
          # DeepSeek V4.1 Flash (first-party api.deepseek.com/v1 only).
          # Retired hosts (Entrim/NVIDIA/Baseten/AIHubmix/OpenAI/CUSTOM_AI) are
          # no longer injected here.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ secrets.XAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DataForSEO Backlinks API — Master SEO Engine links subsystem
          # (lib/seoFactory/backlinkProvider.ts). Basic auth login + password.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Content Studio GSC OAuth — accept every historical secret name
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # GitHub PAT for Content Studio PR creation (repo scope)
          CONTENT_STUDIO_GITHUB_TOKEN: ${{ secrets.CONTENT_STUDIO_GITHUB_TOKEN }}
          GITHUB_TOKEN_CONTENT: ${{ secrets.GITHUB_TOKEN_CONTENT }}
          # Shared secret the weekly-payouts cron route checks (Bearer). Same
          # value as the CRON_SECRET repo secret used by weekly-payouts.yml.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Core auth/database secrets — historically set once manually and
          # silently lost when the Worker is recreated or secrets expire,
          # which made EVERY existing profile look like a brand-new user
          # (no clerk_user_id match, empty email recovery, blank client
          # profile created). Re-synced on every deploy now; no-ops when
          # unset so the deploy stays green until they are configured.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Legacy-eyJ service-role JWT — the ONLY supabase-js v2-usable key
          # format. Without it, a new-format SUPABASE_SERVICE_ROLE_KEY
          # (sb_secret_…) makes every "admin" DB call fall back to the ANON
          # key against open-RLS engine tables.
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NMI_SECURITY_KEY: ${{ secrets.NMI_SECURITY_KEY }}
        run: |
          node scripts/prepare-worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
          echo "WORKER_SECRETS_FILE=$RUNNER_TEMP/worker-secrets.json" >> "$GITHUB_ENV"

      # Mirror the just-synced Worker secrets into the Supabase AI Key Vault
      # (ai_provider_keys). The runtime reads the vault overlay BEFORE Worker
      # secrets, so a stale vault row would otherwise shadow a freshly-rotated
      # key after a rotation that the Worker secret already picked up. Uses the
      # Supabase Management API so it works with both legacy eyJ and sb_secret_
      # service keys. Run before deploy so the new Worker is live against a
      # matching vault. Only the two commissioned Content Studio rows
      # (grok, deepseek-v41-flash) are written; historical rows are retained.
      # Script retries transient SQL failures (e.g. HTTP 544); this step
      # is continue-on-error so Deploy is not blocked if Supabase is briefly
      # unreachable — vault may stay stale until the next successful sync.
      # SUPABASE_ACCESS_TOKEN unset skips cleanly inside the script.
      - name: Sync AI vault (Supabase) from Worker secrets
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          for i in 1 2 3; do
            node scripts/sync-ai-vault.mjs && exit 0
            echo "::warning::AI vault sync attempt $i/3 failed (e.g. SQL 544 timeout); retrying..."
            sleep $((i * 5))
          done
          echo "::warning::AI vault sync failed after 3 attempts — continuing Deploy; vault may be stale until next successful sync."
          exit 1

      # Direct `wrangler deploy` (NOT `opennextjs-cloudflare deploy`): the
      # OpenNext deploy command calls getEnvFromPlatformProxy first, which
      # hits the account's workers/subdomain/edge-preview endpoint and fails
      # with Cloudflare code 10000 under the narrow account-owned CI token.
      # scripts/deploy-production.mjs sets OPEN_NEXT_DEPLOY=true so Wrangler
      # cannot delegate back into OpenNext, and passes the prepared
      # `--secrets-file` so code + secrets publish in the SAME Worker
      # Version. Cloudflare's Workers API sporadically returns [code: 10013]
      # ("unknown error") on the assets-upload-session endpoint during peak
      # hours — the deploy is idempotent, so a bounded retry recovers
      # without manual `gh run rerun --failed` intervention. Three attempts
      # with 30s + 60s back-off; if all three fail the step exits 1 so we
      # never silently mask a real deploy break.
      #
      # LEGACY COMPATIBILITY LABEL: this step name is intentionally retained
      # verbatim because lib/seoFactory/publicationMonitor.ts matches the
      # deploy history by this exact step name. Renaming it silently breaks
      # publication monitoring even though the implementation inside now
      # invokes direct Wrangler.
      - name: Deploy via OpenNext to Cloudflare (with transient-failure retry)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt"
            npm run deploy
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_sec=$((attempt * 30))
              echo "::warning::Deploy attempt $attempt failed (rc=$rc, likely transient Cloudflare API error). Retrying in ${wait_sec}s."
              sleep $wait_sec
            fi
          done
          echo "::error::All 3 deploy attempts failed."
          exit 1

      # The ephemeral Worker secrets file is single-use: delete it as soon as
      # the deploy step has consumed it, even if the deploy failed. Runs on
      # every non-PR path, but never on pull_request jobs (they skip the
      # prepare step, so there is never a file to clean up). The body stays
      # nonexistent-safe defensively.
      - name: Remove ephemeral Worker secrets file
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -n "${WORKER_SECRETS_FILE:-}" ] && [ -f "$WORKER_SECRETS_FILE" ]; then
            rm -f "$WORKER_SECRETS_FILE"
            echo "Removed ephemeral Worker secrets file."
          else
            echo "No ephemeral Worker secrets file to remove."
          fi

      # Startup health check: confirm CLERK_SECRET_KEY and
      # SUPABASE_SERVICE_ROLE_KEY actually landed on the freshly deployed
      # Worker. Fails the deploy red if missing/broken so a regression like
      # "all profiles look like new users" can never ship silently again.
      - name: Verify Worker secrets health (startup check)
        if: github.event_name != 'pull_request'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          set -euo pipefail
          URL="${PORTAL_URL:-https://portal.yousafeconsultancy.com}/api/cron/worker-secrets-health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" || true)
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          python3 - <<'PY'
          import json
          try:
            with open('/tmp/health.json') as f:
              d = json.load(f)
          except Exception as e:
            print('Could not parse health response:', e)
            raise SystemExit(1)
          if not d.get('ok'):
            print('WORKER SECRETS UNHEALTHY:', d.get('failures'))
            raise SystemExit(1)
          print('Worker secrets healthy')
          PY

      # Post-deploy contract gate: the studio must be reachable, the
      # auth-gate + GSC-401 contract must hold, and the served _next buildId
      # must be fresh and consistent (no stale CDN serves). Failing this step
      # fails the deploy, so a broken contract can never ship silently.
      #
      # EXPECTED_BUILD_ID is pinned to the buildId this workflow JUST built
      # (.next/BUILD_ID is written by the build step) — the check asserts the
      # exact bundle we deployed is what production is serving. Retries with
      # backoff because Cloudflare propagates the new build across PoPs over
      # a few minutes; the smoke script's STALE/MIXED flag during that window
      # is expected, and a persistent failure after all attempts is a real
      # break.
      - name: Post-deploy smoke test (studio contract + build freshness)
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          PROD_BASE_URL: ${{ vars.PORTAL_URL }}
        run: |
          set +e
          EXPECTED=""
          if [ -f .next/BUILD_ID ]; then
            EXPECTED=$(cat .next/BUILD_ID)
            echo "Built bundle buildId: ${EXPECTED} — asserting the deploy serves exactly this."
          else
            echo "::warning::.next/BUILD_ID not found — skipping the exact-buildId assert (consistency checks still run)."
          fi
          run_smoke() {
            if [ -n "$EXPECTED" ]; then
              EXPECTED_BUILD_ID="$EXPECTED" node scripts/smoke-prod.mjs
            else
              node scripts/smoke-prod.mjs
            fi
          }
          for attempt in 1 2 3 4 5 6; do
            echo "::group::Smoke test attempt $attempt/6"
            run_smoke
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Post-deploy smoke test passed (attempt $attempt)."
              exit 0
            fi
            if [ $attempt -lt 6 ]; then
              wait_sec=$((attempt * 20))
              echo "::warning::Smoke test failed on attempt $attempt (rc=$rc) — deploy may still be propagating. Retrying in ${wait_sec}s."
              sleep $wait_sec
            fi
          done
          echo "::error::Post-deploy smoke test failed after 6 attempts — studio contract broken."
          exit 1
