name: Deploy YouSafe Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: yousafe-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Quality gate: typecheck + unit tests must pass before anything ships.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npx jest --ci

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }

      # Build needs the NEXT_PUBLIC_ values that Next.js inlines into the
      # client bundle. wrangler.toml has them as plaintext [vars]; we mirror
      # the same values here so the CI build matches the deployed runtime.
      - name: Build (Next + OpenNext)
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SEO audit guard (report-only)
        continue-on-error: true
        run: |
          echo "::group::Portal SEO Audit Guard"
          node scripts/seo-audit-guard.mjs
          echo "::endgroup::"

      # AI provider keys for the SEO assistant + chat widget. Pushed
      # idempotently BEFORE each deploy so rotating a key in GitHub repo
      # secrets takes effect on the next git push — no local
      # `wrangler secret put` ever required. Skips silently if a key is
      # not set so the deploy stays green when only one provider is
      # configured.
      #
      # Runs BEFORE the deploy on purpose: each `wrangler secret put`
      # creates a new Worker Version, and the last one created becomes the
      # active deployment. If secrets were pushed after the deploy, a race
      # could base a secret version on stale deployment state and overwrite
      # the fresh code we just shipped (regression caught by the post-deploy
      # smoke gate on 2026-08-11). Wrangler's deploy inherits these secret
      # bindings (keepSecrets:true), so secrets-first + deploy-last is safe.
      - name: Sync AI provider secrets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # Content Studio AI — primary: Entrim (api.entrim.ai/v1), live
          # Entrim-only policy; NVIDIA/CF/rest are out of commission.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_DEEPSEEK_MODEL: ${{ secrets.NVIDIA_DEEPSEEK_MODEL }}
          NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ secrets.XAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          BASETEN_MODEL: ${{ secrets.BASETEN_MODEL }}
          BASETEN_GLM_MODEL: ${{ secrets.BASETEN_GLM_MODEL }}
          # DataForSEO Backlinks API — Master SEO Engine links subsystem
          # (lib/seoFactory/backlinkProvider.ts). Basic auth login + password.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # AIHubmix OpenAI-compatible aggregator — GLM 5.2 Fast route
          # (lib/contentAiProvider.ts getAihubmixGlmFastProvider).
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          AIHUBMIX_BASE_URL: ${{ secrets.AIHUBMIX_BASE_URL }}
          AIHUBMIX_GLM_MODEL: ${{ secrets.AIHUBMIX_GLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          CUSTOM_AI_BASE_URL: ${{ secrets.CUSTOM_AI_BASE_URL }}
          CUSTOM_AI_API_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
          CUSTOM_AI_MODEL: ${{ secrets.CUSTOM_AI_MODEL }}
          # Content Studio GSC OAuth — accept every historical secret name
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Entrim (api.entrim.ai/v1) — graduated default model host. Pushed to
          # the Worker as a first-class secret so Draft/Brief/Reviewer/Discover
          # keep running even while the vault overlay is unreachable.
          ENTRIM_API_KEY: ${{ secrets.ENTRIM_API_KEY }}
          ENTRIM_BASE_URL: ${{ secrets.ENTRIM_BASE_URL }}
          # GitHub PAT for Content Studio PR creation (repo scope)
          CONTENT_STUDIO_GITHUB_TOKEN: ${{ secrets.CONTENT_STUDIO_GITHUB_TOKEN }}
          GITHUB_TOKEN_CONTENT: ${{ secrets.GITHUB_TOKEN_CONTENT }}
          # Shared secret the weekly-payouts cron route checks (Bearer). Same
          # value as the CRON_SECRET repo secret used by weekly-payouts.yml.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTENT_AI_PROVIDER: ${{ secrets.CONTENT_AI_PROVIDER }}
          # Core auth/database secrets — historically set once manually and
          # silently lost when the Worker is recreated or secrets expire,
          # which made EVERY existing profile look like a brand-new user
          # (no clerk_user_id match, empty email recovery, blank client
          # profile created). Re-synced on every deploy now; no-ops when
          # unset so the deploy stays green until they are configured.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Legacy-eyJ service-role JWT — the ONLY supabase-js v2-usable key
          # format. Without it, a new-format SUPABASE_SERVICE_ROLE_KEY
          # (sb_secret_…) makes every "admin" DB call fall back to the ANON
          # key against open-RLS engine tables.
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NMI_SECURITY_KEY: ${{ secrets.NMI_SECURITY_KEY }}
        run: |
          # Cloudflare's secret API occasionally rejects subsequent secret
          # pushes within the same workflow run with "Secret edit failed.
          # You attempted to modify a secret, but the latest version of
          # your Worker isn't currently deployed." This is a race condition
          # between Cloudflare's deployment-state propagation and the
          # secrets API. The race bit us on run #26874086278 (commit
          # 1b3c8d8) — 5 secrets uploaded successfully, 6th failed.
          #
          # Mitigation: wrap each secret push in a bounded retry loop with
          # exponential-ish backoff. The "latest version not deployed"
          # error clears within 5-15s as Cloudflare's internal state
          # settles, so 3 retries with 5s/10s/20s waits cover the worst
          # case.
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name not set in repo secrets — skipping"
              return 0
            fi
            for attempt in 1 2 3 4; do
              if printf '%s' "$value" | npx wrangler secret put "$name" 2>&1 | tee /tmp/wrangler-secret-$$.log; then
                rm -f /tmp/wrangler-secret-$$.log
                return 0
              fi
              if grep -q "latest version of your Worker isn't currently deployed" /tmp/wrangler-secret-$$.log; then
                local wait=$((attempt * 5))
                echo "Cloudflare deployment-state race — waiting ${wait}s and retrying $name (attempt $attempt/4)…"
                sleep "$wait"
                continue
              fi
              # Some other error — surface it and fail the step.
              cat /tmp/wrangler-secret-$$.log
              rm -f /tmp/wrangler-secret-$$.log
              return 1
            done
            echo "ERROR: failed to push $name after 4 attempts"
            return 1
          }


          put_secret GROQ_API_KEY              "$GROQ_API_KEY"
          put_secret GEMINI_API_KEY            "$GEMINI_API_KEY"
          # Cloudflare Workers AI — third fallback provider, runs
          # on Cloudflare's GPU fleet (lib/chatProvider.ts buildCloudflareAI).
          # Uses a SCOPED token (Workers AI : Read) stored as
          # CLOUDFLARE_AI_TOKEN. The deploy-time CLOUDFLARE_API_TOKEN does
          # NOT have Workers AI scope and returns 401 code 10000 when used
          # against the AI REST endpoint, so we keep the two tokens distinct.
          # Independent quota from Groq + Gemini — when both hit their
          # daily TPD limits the AI surface stays alive via this path.
          # Free tier: 10k Neurons/day ≈ 2000 Llama-3.3-70b generations.
          # If CLOUDFLARE_AI_TOKEN is unset the third provider is dropped
          # from the chain (put_secret is a no-op on empty value).
          put_secret CLOUDFLARE_ACCOUNT_ID     "$CLOUDFLARE_ACCOUNT_ID"
          # NOTE: the deploy token (CLOUDFLARE_API_TOKEN) is deliberately NOT
          # uploaded as a runtime secret — lib/chatProvider.ts only reads the
          # scoped CLOUDFLARE_AI_TOKEN, and runtime should never hold deploy
          # credentials.
          put_secret CLOUDFLARE_AI_TOKEN       "$CLOUDFLARE_AI_TOKEN"
          # OpenRouter — fourth fallback. The free models have their own
          # per-day quota separate from every other provider, so the chain
          # gets genuine extra headroom rather than re-hitting an upstream
          # that's already throttled. Drop-in if unset.
          put_secret OPENROUTER_API_KEY        "$OPENROUTER_API_KEY"
          # GSC live-keyword signals (lib/gscKeywordSignals.ts). All four
          # must be set for the live path to activate; the module returns
          # null and falls back to static keywords if any are missing.
          # Skipping silently keeps the deploy green when GSC isn't yet
          # provisioned.
          put_secret GSC_OAUTH_CLIENT_ID       "$GSC_OAUTH_CLIENT_ID"
          put_secret GSC_OAUTH_CLIENT_SECRET   "$GSC_OAUTH_CLIENT_SECRET"
          put_secret GSC_OAUTH_REFRESH_TOKEN   "$GSC_OAUTH_REFRESH_TOKEN"
          put_secret GSC_SITE_URL              "$GSC_SITE_URL"
          # Service account JSON (gsc-reader@yousafe-gsc-reader.iam.gserviceaccount.com).
          # Must be added as Full user on each Search Console property for live queries.
          put_secret GSC_SERVICE_ACCOUNT_JSON  "$GSC_SERVICE_ACCOUNT_JSON"
          # Content Studio AI chain (lib/contentAiProvider.ts) — LIVE POLICY
          # (2026-09-02): the ONLY commissioned backends are the two Entrim
          # families — Entrim Qwen3.6 27B (default) then Entrim DeepSeek V4
          # Flash. Every other host (NVIDIA, Cloudflare, Groq, Gemini,
          # OpenRouter, xAI, OpenAI, DeepSeek.com, Baseten, Parasail, Run
          # BiOS, AIHubmix, Zai) is OUT OF COMMISSION and filtered out of
          # the cascade at runtime. The worker always pins
          # CONTENT_AI_PROVIDER so a stale Worker secret cannot force a
          # retired host first after a code deploy. Values are fixed
          # (not from secrets) so put_secret always has a non-empty value.
          # NOTE: deepseek-v4-pro is EOL on NVIDIA (410 Gone since 2026-08-07).
          # CONTENT_AI_PROVIDER is pinned LITERALLY — never interpolate the
          # CONTENT_AI_PROVIDER GitHub secret here, a leftover/rotated value
          # must not re-pin a retired host ahead of a code deploy.
          put_secret CONTENT_AI_PROVIDER       "entrim-qwen-27b"
          put_secret NVIDIA_DEEPSEEK_MODEL     "${NVIDIA_DEEPSEEK_MODEL:-deepseek-ai/deepseek-v4-flash-0731}"
          # NVIDIA key aliases — any one unlocks the primary path
          put_secret NVIDIA_API_KEY            "${NVIDIA_API_KEY:-$NVAPI_KEY}"
          put_secret NVAPI_KEY                 "${NVAPI_KEY:-$NVIDIA_API_KEY}"
          put_secret XAI_API_KEY               "$XAI_API_KEY"
          put_secret XAI_MODEL                  "$XAI_MODEL"
          put_secret DEEPSEEK_API_KEY          "$DEEPSEEK_API_KEY"
          put_secret BASETEN_API_KEY           "$BASETEN_API_KEY"
          put_secret BASETEN_MODEL             "${BASETEN_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}"
          put_secret BASETEN_GLM_MODEL         "${BASETEN_GLM_MODEL:-zai-org/GLM-5.2-Fast}"
          # DataForSEO Backlinks API — Master SEO Engine links subsystem.
          # Basic-auth login + password; put_secret no-ops when unset so a
          # deploy stays green until the credentials are provisioned.
          put_secret DATAFORSEO_LOGIN          "$DATAFORSEO_LOGIN"
          put_secret DATAFORSEO_PASSWORD       "$DATAFORSEO_PASSWORD"
          # AIHubmix GLM 5.2 Fast (OpenAI-compatible aggregator) — drafting /
          # brief / review route. put_secret no-ops when unset.
          put_secret AIHUBMIX_API_KEY          "$AIHUBMIX_API_KEY"
          put_secret AIHUBMIX_BASE_URL         "${AIHUBMIX_BASE_URL:-https://aihubmix.com/v1}"
          put_secret AIHUBMIX_GLM_MODEL        "${AIHUBMIX_GLM_MODEL:-glm-5.2-fast-preview}"
          put_secret OPENAI_API_KEY            "$OPENAI_API_KEY"
          put_secret OPENAI_MODEL              "${OPENAI_MODEL:-gpt-5.6-luna}"
          put_secret CUSTOM_AI_BASE_URL        "$CUSTOM_AI_BASE_URL"
          put_secret CUSTOM_AI_API_KEY         "$CUSTOM_AI_API_KEY"
          put_secret CUSTOM_AI_MODEL           "$CUSTOM_AI_MODEL"
          # Content Studio GSC OAuth (routes accept GOOGLE_* / GSC_OAUTH_* / GOOGLE_OAUTH_*)
          put_secret GOOGLE_CLIENT_ID          "${GOOGLE_CLIENT_ID:-${GSC_OAUTH_CLIENT_ID:-$GOOGLE_OAUTH_CLIENT_ID}}"
          put_secret GOOGLE_CLIENT_SECRET      "${GOOGLE_CLIENT_SECRET:-${GSC_OAUTH_CLIENT_SECRET:-$GOOGLE_OAUTH_CLIENT_SECRET}}"
          put_secret GSC_OAUTH_CLIENT_ID       "${GSC_OAUTH_CLIENT_ID:-${GOOGLE_CLIENT_ID:-$GOOGLE_OAUTH_CLIENT_ID}}"
          put_secret GSC_OAUTH_CLIENT_SECRET   "${GSC_OAUTH_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET:-$GOOGLE_OAUTH_CLIENT_SECRET}}"
          # Prefer dedicated Content Studio GitHub token; fall back to GITHUB_TOKEN_CONTENT
          put_secret GITHUB_TOKEN              "${CONTENT_STUDIO_GITHUB_TOKEN:-$GITHUB_TOKEN_CONTENT}"
          # Entrim (api.entrim.ai/v1) — graduated default model host for
          # Draft / Brief / Reviewer / Discover. Kept as a FIRST-CLASS
          # Worker secret so generation works even while the vault overlay
          # is unreachable (supabase-js v2 rejects sb_secret_ service keys,
          # and ai_provider_keys denies the anon fallback).
          put_secret ENTRIM_API_KEY            "$ENTRIM_API_KEY"
          put_secret ENTRIM_BASE_URL           "$ENTRIM_BASE_URL"
          # Weekly payout cron auth — POST /api/cron/weekly-payouts checks this.
          put_secret CRON_SECRET               "$CRON_SECRET"
          # Core auth/database secrets (see env block above). Keeping these
          # synced on every deploy prevents the "all profiles treated as new"
          # failure mode caused by missing Worker secrets.
          put_secret CLERK_SECRET_KEY          "$CLERK_SECRET_KEY"
          put_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          put_secret SUPABASE_SERVICE_ROLE_JWT "$SUPABASE_SERVICE_ROLE_JWT"
          put_secret RESEND_API_KEY            "$RESEND_API_KEY"
          put_secret NMI_SECURITY_KEY          "$NMI_SECURITY_KEY"

      # Mirror the just-synced Worker secrets into the Supabase AI Key Vault
      # (ai_provider_keys). The runtime reads the vault overlay BEFORE Worker
      # secrets, so a stale vault row would otherwise shadow a freshly-rotated
      # key (e.g. Baseten 402 "check your current payment status" after a key
      # rotation that the Worker secret already picked up). Uses the Supabase
      # Management API so it works with both legacy eyJ and sb_secret_ service
      # keys. Run before deploy so the new Worker is live against a matching
      # vault. Script retries transient SQL failures (e.g. HTTP 544); this step
      # is continue-on-error so Deploy is not blocked if Supabase is briefly
      # unreachable — vault may stay stale until the next successful sync.
      # SUPABASE_ACCESS_TOKEN unset skips cleanly inside the script.
      - name: Sync AI vault (Supabase) from Worker secrets
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CUSTOM_AI_API_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
        run: |
          set +e
          for i in 1 2 3; do
            node scripts/sync-ai-vault.mjs && exit 0
            echo "::warning::AI vault sync attempt $i/3 failed (e.g. SQL 544 timeout); retrying..."
            sleep $((i * 5))
          done
          echo "::warning::AI vault sync failed after 3 attempts — continuing Deploy; vault may be stale until next successful sync."
          exit 1

      # Worker secrets (RESEND_API_KEY, CLERK_SECRET_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, NMI_SECURITY_KEY) live on the worker itself,
      # set once via `wrangler versions secret put`. CI does not push them.
      #
      # ORDERING INVARIANT: this step MUST be the LAST deploy action in
      # the workflow. The secrets-sync step runs BEFORE it (see below), and
      # wrangler's deploy path uses keepSecrets:true to inherit every secret
      # binding from the previous Worker Version. If a `wrangler secret put`
      # ever runs AFTER this step, a deployment-propagation race can make it
      # base its new version on STALE code, and because the last secret put
      # becomes the active deployment, stale code would silently win.
      # Cloudflare's Workers API sporadically returns [code: 10013]
      # ("unknown error") on the assets-upload-session endpoint during peak
      # hours — the deploy is idempotent, so a bounded retry recovers
      # without manual `gh run rerun --failed` intervention. Three attempts
      # with 30s + 60s back-off; if all three fail the step fails red so we
      # never silently mask a real deploy break.
      - name: Deploy via OpenNext to Cloudflare (with transient-failure retry)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt"
            npm run deploy
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_sec=$((attempt * 30))
              echo "::warning::Deploy attempt $attempt failed (rc=$rc, likely transient Cloudflare API error). Retrying in ${wait_sec}s."
              sleep $wait_sec
            fi
          done
          echo "::error::All 3 deploy attempts failed."

      # Startup health check: confirm CLERK_SECRET_KEY and
      # SUPABASE_SERVICE_ROLE_KEY actually landed on the freshly deployed
      # Worker. Fails the deploy red if missing/broken so a regression like
      # "all profiles look like new users" can never ship silently again.
      - name: Verify Worker secrets health (startup check)
        if: github.event_name != 'pull_request'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          set -euo pipefail
          URL="${PORTAL_URL:-https://portal.yousafeconsultancy.com}/api/cron/worker-secrets-health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" || true)
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          python3 - <<'PY'
          import json
          try:
            with open('/tmp/health.json') as f:
              d = json.load(f)
          except Exception as e:
            print('Could not parse health response:', e)
            raise SystemExit(1)
          if not d.get('ok'):
            print('WORKER SECRETS UNHEALTHY:', d.get('failures'))
            raise SystemExit(1)
          print('Worker secrets healthy')
          PY

      # Post-deploy contract gate: the studio must be reachable, the
      # auth-gate + GSC-401 contract must hold, and the served _next buildId
      # must be fresh and consistent (no stale CDN serves). Failing this step
      # fails the deploy, so a broken contract can never ship silently.
      #
      # EXPECTED_BUILD_ID is pinned to the buildId this workflow JUST built
      # (.next/BUILD_ID is written by the build step) — the check asserts the
      # exact bundle we deployed is what production is serving. Retries with
      # backoff because Cloudflare propagates the new build across PoPs over
      # a few minutes; the smoke script's STALE/MIXED flag during that window
      # is expected, and a persistent failure after all attempts is a real
      # break.
      - name: Post-deploy smoke test (studio contract + build freshness)
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          PROD_BASE_URL: ${{ vars.PORTAL_URL }}
        run: |
          set +e
          EXPECTED=""
          if [ -f .next/BUILD_ID ]; then
            EXPECTED=$(cat .next/BUILD_ID)
            echo "Built bundle buildId: ${EXPECTED} — asserting the deploy serves exactly this."
          else
            echo "::warning::.next/BUILD_ID not found — skipping the exact-buildId assert (consistency checks still run)."
          fi
          run_smoke() {
            if [ -n "$EXPECTED" ]; then
              EXPECTED_BUILD_ID="$EXPECTED" node scripts/smoke-prod.mjs
            else
              node scripts/smoke-prod.mjs
            fi
          }
          for attempt in 1 2 3 4 5 6; do
            echo "::group::Smoke test attempt $attempt/6"
            run_smoke
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Post-deploy smoke test passed (attempt $attempt)."
              exit 0
            fi
            if [ $attempt -lt 6 ]; then
              wait_sec=$((attempt * 20))
              echo "::warning::Smoke test failed on attempt $attempt (rc=$rc) — deploy may still be propagating. Retrying in ${wait_sec}s."
              sleep $wait_sec
            fi
          done
          echo "::error::Post-deploy smoke test failed after 6 attempts — studio contract broken."
          exit 1
