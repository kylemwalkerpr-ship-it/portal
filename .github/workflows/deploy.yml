name: Deploy YouSafe Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: yousafe-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }

      # Build needs the NEXT_PUBLIC_ values that Next.js inlines into the
      # client bundle. wrangler.toml has them as plaintext [vars]; we mirror
      # the same values here so the CI build matches the deployed runtime.
      - name: Build (Next + OpenNext)
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # Worker secrets (RESEND_API_KEY, CLERK_SECRET_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, NMI_SECURITY_KEY) live on the worker itself,
      # set once via `wrangler versions secret put`. CI does not push them.
      # Cloudflare's Workers API sporadically returns [code: 10013]
      # ("unknown error") on the assets-upload-session endpoint during peak
      # hours — the deploy is idempotent, so a bounded retry recovers
      # without manual `gh run rerun --failed` intervention. Three attempts
      # with 30s + 60s back-off; if all three fail the step fails red so we
      # never silently mask a real deploy break.
      - name: Deploy via OpenNext to Cloudflare (with transient-failure retry)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt"
            npm run deploy
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_sec=$((attempt * 30))
              echo "::warning::Deploy attempt $attempt failed (rc=$rc, likely transient Cloudflare API error). Retrying in ${wait_sec}s."
              sleep $wait_sec
            fi
          done
          echo "::error::All 3 deploy attempts failed."
          exit 1

      # AI provider keys for the SEO assistant + chat widget. Pushed
      # idempotently after each deploy so rotating a key in GitHub repo
      # secrets takes effect on the next git push — no local
      # `wrangler secret put` ever required. Skips silently if a key is
      # not set so the deploy stays green when only one provider is
      # configured.
      - name: Sync AI provider secrets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          else
            echo "GROQ_API_KEY not set in repo secrets — skipping"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo "GEMINI_API_KEY not set in repo secrets — skipping"
          fi
