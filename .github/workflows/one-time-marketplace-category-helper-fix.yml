name: One-time marketplace category helper fix

on:
  push:
    branches:
      - fix/marketplace-clean-category-urls-cards

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketplace-clean-category-urls-cards
          fetch-depth: 0

      - name: Normalize helper source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('middleware.ts')
          source = path.read_text()
          start = source.find('\\n/** Remove a category query value')
          if start < 0:
              raise SystemExit('malformed helper start not found')
          end = source.find('\nexport default clerkMiddleware(', start)
          if end < 0:
              raise SystemExit('middleware export marker not found')

          helper = """
/** Remove a category query value that merely repeats the clean route slug. */
function stripRedundantCategoryParam(url: URL): string | null {
  const match = url.pathname.match(/^\\/categories\\/([^/]+)\\/?$/)
  if (!match) return null

  const routeCategory = decodeURIComponent(match[1])
  const categories = url.searchParams.getAll('category')
  if (!categories.includes(routeCategory)) return null

  const remaining = categories.filter((category) => category !== routeCategory)
  url.searchParams.delete('category')
  remaining.forEach((category) => url.searchParams.append('category', category))
  return url.pathname + (url.searchParams.toString() ? `?${url.searchParams}` : '')
}
"""
          path.write_text(source[:start] + helper + source[end:])
          PY

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/one-time-marketplace-category-helper-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add middleware.ts .github/workflows/one-time-marketplace-category-helper-fix.yml
          git diff --cached --check
          git commit -m "Fix category URL helper source formatting"
          git push origin HEAD:fix/marketplace-clean-category-urls-cards
