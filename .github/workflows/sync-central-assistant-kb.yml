name: Sync central assistant knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  # Keep the network corpus fresh whenever assistant knowledge sources change.
  # The generated snapshot is excluded so the bot's refresh commit cannot
  # recursively trigger another crawl.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-central-assistant-kb.yml'
      - 'scripts/sync-central-assistant-kb.mjs'
      - 'lib/centralAssistantKnowledge.ts'
      - 'lib/messengerSiteKnowledge.ts'
      - 'content/messenger-kb/**'
      - '!content/messenger-kb/network-pages.json'

permissions:
  contents: write

concurrency:
  group: central-assistant-kb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crawl public YouSafe network
        run: node scripts/sync-central-assistant-kb.mjs

      - name: Validate central knowledge
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const rows = JSON.parse(fs.readFileSync('content/messenger-kb/network-pages.json', 'utf8'))
          if (!Array.isArray(rows) || rows.length < 10) {
            throw new Error(`Central assistant KB is unexpectedly small: ${Array.isArray(rows) ? rows.length : 'invalid'}`)
          }
          const sites = new Set(rows.map((row) => String(row.id || '').split(':')[1]).filter(Boolean))
          if (sites.size < 3) {
            throw new Error(`Central assistant KB covers too few sites: ${sites.size}`)
          }
          console.log(`Validated ${rows.length} knowledge pages across ${sites.size} YouSafe surfaces.`)
          NODE

      - name: Commit refreshed knowledge when changed
        shell: bash
        run: |
          if git diff --quiet -- content/messenger-kb/network-pages.json; then
            echo "Central assistant knowledge is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/messenger-kb/network-pages.json
          git commit -m "chore: refresh central assistant network knowledge"

          # Main can move while the crawler is running. Rebase and retry rather
          # than dropping a valid knowledge refresh because another PR landed.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Knowledge push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done
          exit 1
