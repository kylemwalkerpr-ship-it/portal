name: Lead Follow-ups

# Runs hourly: sends the 24h and 72h reminder emails to free /get-matched
# intake leads who have not created an account (app/api/cron/lead-followups).
# Can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: '41 * * * *'   # hourly at :41
  workflow_dispatch: {}

jobs:
  followups:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lead follow-ups
        run: |
          set -euo pipefail
          URL="${PORTAL_URL:-https://portal.yousafeconsultancy.com}/api/cron/lead-followups"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $code"; cat /tmp/resp.json || true
          test "$code" = "200"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
