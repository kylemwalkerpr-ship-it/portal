name: Rhythm Scan Weekly

# Every Monday 06:00 UTC — scans stored drafts for sentence_start_repetition
# that slipped through the gate, persists alerts to content_rhythm_alerts, and
# posts the flagged list to the admin dashboard. Can also be run on demand
# from the Actions tab.
#
# The scan runs on the Actions runner (scripts/run-rhythm-scan.mts), not via
# POST /api/cron/rhythm-scan-weekly: scanning hundreds of drafts through the
# full quality gate exceeds the Workers Free-plan per-request limit (503 /
# error 1102, failing weekly since 2026-09-21). Same runRhythmScan(), same rows.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max drafts to scan (default 500)'
        required: false
        default: '500'

concurrency:
  group: rhythm-scan-weekly
  cancel-in-progress: false

jobs:
  rhythm-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weekly rhythm scan
        run: npx -y tsx scripts/run-rhythm-scan.mts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          RHYTHM_LIMIT: ${{ github.event.inputs.limit || '500' }}
