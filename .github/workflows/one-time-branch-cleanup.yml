name: One-time stale branch cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
      - '.github/one-time-branch-cleanup-trigger'
  push:
    branches:
      - main
    paths:
      - '.github/one-time-branch-cleanup-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit and prune stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name != 'push' }}
          CURRENT_PR_HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          const repository = process.env.GITHUB_REPOSITORY
          const [owner] = repository.split('/')
          const token = process.env.GH_TOKEN
          const dryRun = process.env.DRY_RUN === 'true'
          const currentPrHead = process.env.CURRENT_PR_HEAD || ''
          if (!repository || !owner || !token) throw new Error('Missing GitHub workflow context')

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'yousafe-one-time-branch-cleanup',
          }

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            })
            const text = await response.text()
            let body = null
            if (text) {
              try { body = JSON.parse(text) } catch { body = text }
            }
            if (!response.ok) {
              const error = new Error(`${options.method || 'GET'} ${path} -> ${response.status}`)
              error.status = response.status
              error.body = body
              throw error
            }
            return body
          }

          // These branches were manually audited before this cleanup. They either
          // contain superseded implementations, were folded into a later merged PR,
          // or contain stale generated repair commits that must not be revived.
          const auditedSuperseded = new Set([
            'fix/final-main-typecheck',
            'fix/final-main-typecheck-v2',
            'fix/main-typecheck-deploy',
            'fix/post-merge-tsci',
            'fix/ios-messenger-browser-chrome-clearance',
            'fix/ios-messenger-keyboard-viewport',
            'fix/marketplace-mobile-profiles-gig-flow',
            'harden-yousafe-ai',
            'harden-yousafe-ai-reliability',
            'marketplace/fiverr-grade-copy-rewrite',
            'release/marketplace-url-cleanup-final',
            'seo/legacy-marketplace-slug-migration',
            'seo/orphan-repair-1786100606342',
            'seo/orphan-repair-1786809705788',
            'seo/orphan-repair-1786868733463',
            'seo/orphan-repair-1788800577704',
            'fix/marketplace-mobile-bottom-gap',
            'perf/marketplace-first-paint',
            'fix/marketplace-category-copy',
            'fix/marketplace-footer-coverage',
          ])

          async function main() {
            const mainBranch = await api(`/repos/${repository}/branches/main`)
            const mainSha = mainBranch.commit.sha
            const branches = await api(`/repos/${repository}/branches?per_page=100`)

            const removable = []
            const deleted = []
            const preserved = []

            for (const branch of branches) {
              const name = branch.name
              if (name === 'main') continue

              // During the PR dry-run, the branch executing this workflow is not
              // merged yet by definition. Skip only that one transient head. On the
              // main/push run it is no longer exempt and must satisfy the normal
              // ancestry or exact-merged-PR checks before deletion.
              if (dryRun && currentPrHead && name === currentPrHead) continue

              let reason = null
              let compare = null
              try {
                compare = await api(`/repos/${repository}/compare/${mainSha}...${branch.commit.sha}`)
              } catch (error) {
                preserved.push(`${name} — compare failed (${error.status || 'unknown'})`)
                continue
              }

              // If the branch has no commits outside main, it is fully integrated.
              if (compare.ahead_by === 0) {
                reason = 'fully contained in main'
              }

              // Squash merges are not ancestors of main. For those, require a merged
              // PR whose recorded head SHA is exactly the current branch tip.
              if (!reason) {
                const query = new URLSearchParams({
                  head: `${owner}:${name}`,
                  state: 'all',
                  per_page: '100',
                })
                const prs = await api(`/repos/${repository}/pulls?${query}`)
                const exactMerged = prs.find((pr) => pr.merged_at && pr.head?.sha === branch.commit.sha)
                if (exactMerged) reason = `merged in PR #${exactMerged.number}`
              }

              // Only branches explicitly reviewed during this cleanup may bypass the
              // ancestry/exact-merged checks.
              if (!reason && auditedSuperseded.has(name)) {
                reason = 'manually audited as superseded/stale'
              }

              if (!reason) {
                preserved.push(`${name} — ${compare.ahead_by} unexplained commit(s) ahead of main`)
                continue
              }

              removable.push(`${name} — ${reason}`)
              if (dryRun) continue

              const refPath = name.split('/').map(encodeURIComponent).join('/')
              try {
                await api(`/repos/${repository}/git/refs/heads/${refPath}`, { method: 'DELETE' })
                deleted.push(`${name} — ${reason}`)
              } catch (error) {
                preserved.push(`${name} — deletion failed (${error.status || 'unknown'})`)
              }
            }

            const actionWord = dryRun ? 'Would delete' : 'Deleted'
            const actionRows = dryRun ? removable : deleted
            const summary = [
              `# One-time branch cleanup${dryRun ? ' — dry run' : ''}`,
              '',
              `${actionWord}: ${actionRows.length}`,
              `Preserved for manual review: ${preserved.length}`,
              '',
              `## ${actionWord}`,
              ...(actionRows.length ? actionRows.map((x) => `- ${x}`) : ['- None']),
              '',
              '## Preserved',
              ...(preserved.length ? preserved.map((x) => `- ${x}`) : ['- None']),
              '',
            ].join('\n')

            console.log(summary)
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)

            // Fail closed if anything remains unexplained. In dry-run mode this is
            // the release gate; on main it also prevents us from claiming the cleanup
            // is complete when a branch still needs human review.
            if (preserved.length) {
              throw new Error(`${preserved.length} branch(es) preserved for manual review`)
            }
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Checkout main for self-removal
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Remove one-time cleanup machinery
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/one-time-branch-cleanup.yml
          rm -f .github/one-time-branch-cleanup-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/one-time-branch-cleanup.yml .github/one-time-branch-cleanup-trigger

          if git diff --cached --quiet; then
            echo "One-time cleanup files are already absent."
            exit 0
          fi

          git commit -m "chore: remove one-time branch cleanup machinery"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Cleanup self-removal push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done
          exit 1
