name: Manual YQAA Live Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit that the latest successful official deploy published
        required: true
        type: string
      expected_build_id:
        description: Next.js build ID shown by that official production deployment
        required: true
        type: string
      client_profile_id:
        description: Optional authorized designated client profile ID for acceptance
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: yqaa-live-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  live-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact requested main commit
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Fail closed unless dispatch is exact main and current deployed source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BUILD_ID" =~ ^[A-Za-z0-9_-]{10,}$ ]]
          echo "Dispatch checkout is the requested main SHA; production will be checked against the official deployment run and build ID before any fixture writes."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Full Jest suite
        run: npx jest --ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded authenticated production acceptance
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
          YQAA_EXPECTED_SHA: ${{ inputs.expected_sha }}
          YQAA_EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
          YQAA_CLIENT_PROFILE_ID: ${{ inputs.client_profile_id }}
        run: node scripts/yqaa-live-acceptance.mjs

      - name: Upload sanitized acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yqaa-live-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/yqaa-live-acceptance/yqaa-live-acceptance-receipt.json
          if-no-files-found: ignore
          retention-days: 7
